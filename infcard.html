<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>무한의 군주 — 카드 RPG</title>
<meta name="description" content="무한의 군주: 마나 코스트·약점 브레이크·속성 콤보로 싸우는 다크 판타지 카드 RPG. 30챕터 × 30스테이지, 카드 소환·덱 편성·강화·도감·아레나.">
<meta name="theme-color" content="#08050f">
<style>
/* ════════════════ 0 · 기반 ════════════════ */
:root{
  --bg:#07050e; --bg2:#0d0819; --panel:#140d24; --panel2:#1c1233;
  --gold:#f5c96a; --gold2:#ffe6ab; --gold3:#b8862f;
  --ink:#f6f0ff; --muted:#a190c2; --muted2:#7a6b98;
  --line:rgba(255,255,255,.085); --line-gold:rgba(245,201,106,.34);
  --common:#9aa3bd; --rare:#4fb6ff; --epic:#b06bff; --legend:#ffc44d; --myth:#ff5f9e;
  --red:#ff5468; --green:#5ce08a; --blue:#6cc6ff; --violet:#b47bff;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  --shadow:0 18px 40px rgba(0,0,0,.55);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#05030b;color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;word-break:keep-all;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
canvas{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(245,201,106,.22);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* 배경: 성운 + 별 + 비네트 */
#bgFx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:
  radial-gradient(80% 60% at 50% -10%,#2a1150 0%,rgba(20,8,40,.6) 45%,transparent 75%),
  radial-gradient(70% 50% at 100% 100%,rgba(70,20,110,.35),transparent 70%),
  radial-gradient(60% 40% at 0% 80%,rgba(20,60,90,.28),transparent 70%),
  linear-gradient(180deg,#0a0616 0%,#05030b 60%,#08040f 100%);}
#bgFx canvas{width:100%;height:100%;opacity:.85}
#bgFx::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)}

#app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;z-index:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .26s ease}
.screen.on{opacity:1;pointer-events:auto}

/* ════════════════ 1 · 공용 ════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border-radius:13px;font-weight:800;font-size:15px;letter-spacing:.2px;
  background:linear-gradient(180deg,#31214f,#1d1332);color:#efe6ff;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #100a1c,0 10px 22px rgba(0,0,0,.45);
  transition:transform .09s var(--ease),filter .18s,box-shadow .2s;position:relative;overflow:hidden;
}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 62%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #100a1c}
.btn.gold{background:linear-gradient(180deg,#ffe9b0,#f0bb54 45%,#d1942c);color:#3a2200;border-color:#fff3cd;
  box-shadow:inset 0 1px 0 #fffbe8,0 3px 0 #7d5510,0 10px 26px rgba(245,201,106,.32)}
.btn.primary{background:linear-gradient(180deg,#9a5cff,#6330cf 60%,#4b1fa8);border-color:#c4a4ff;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #2a1060,0 10px 26px rgba(140,80,255,.35)}
.btn.ghost{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.14);box-shadow:none;color:#d9cdf0}
.btn.danger{background:linear-gradient(180deg,#e8445a,#a01226);border-color:#ff9aa8;color:#fff;box-shadow:0 3px 0 #5d0813}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.lg{padding:15px 28px;font-size:17px;border-radius:15px}
.btn.block{display:flex;width:100%}
.btn:disabled,.btn[disabled]{opacity:.4;filter:grayscale(.55);pointer-events:none}
.icobtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:linear-gradient(180deg,rgba(60,40,96,.9),rgba(28,18,50,.9));
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .1s,filter .2s;
}
.icobtn:active{transform:scale(.93)}
.icobtn.on{background:linear-gradient(180deg,rgba(245,201,106,.28),rgba(120,80,20,.4));border-color:var(--line-gold);color:var(--gold2)}
.hair{height:1px;background:linear-gradient(90deg,transparent,rgba(245,201,106,.35),transparent);margin:12px 0}
.mono{font-family:var(--mono);letter-spacing:.5px}
.gold-txt{color:var(--gold2)}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.center{text-align:center}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ════════════════ 2 · 타이틀 ════════════════ */
#scrTitle{align-items:center;justify-content:center;text-align:center;padding:26px 22px 40px;gap:4px}
.title-emblem{position:relative;width:min(300px,74vw);height:min(300px,74vw);margin-bottom:-8px;display:flex;align-items:center;justify-content:center}
.title-emblem>canvas{position:absolute;inset:0;width:100%;height:100%}
.title-emblem .tc{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.title-emblem .tc:nth-child(2){transform:rotate(0) translateY(-16px) scale(1.08);z-index:3}
.title-emblem .tc:nth-child(3){transform:rotate(8deg)}
.kicker{font-size:10.5px;letter-spacing:5px;color:#c8a8ff;text-transform:uppercase;opacity:.9;margin-bottom:2px}
.title-logo{
  font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:-1.5px;line-height:1.02;margin:6px 0 2px;
  background:linear-gradient(178deg,#fffbe9 8%,#ffe6ab 30%,#f5c96a 52%,#b8862f 74%,#ffe9b8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(58,29,0,.9)) drop-shadow(0 0 30px rgba(245,201,106,.35));
}
.title-sub{color:#cbb6ee;font-size:12.5px;line-height:1.7;max-width:330px;margin:2px 0 18px;opacity:.92}
.title-actions{display:flex;flex-direction:column;gap:9px;align-items:center;width:min(280px,80vw)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-9px) rotate(var(--rot,0deg))}}
.title-foot{position:absolute;bottom:14px;left:0;right:0;font-size:10.5px;color:#6f6190;letter-spacing:.4px}

/* ════════════════ 3 · 온보딩 ════════════════ */
.screen-head{padding:24px 18px 6px;text-align:center;flex:0 0 auto}
.screen-head .h-kicker{font-size:10px;letter-spacing:4px;color:#a98ad8;text-transform:uppercase}
.screen-head h1{margin:6px 0 0;font-size:clamp(21px,5.6vw,30px);letter-spacing:-.4px;
  background:linear-gradient(180deg,#fff6dd,#f5c96a 70%,#c99a3c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(245,201,106,.2))}
.screen-head p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.starter-row{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 14px 6px;flex-wrap:wrap;align-content:center;overflow-y:auto}
.pick-card{
  width:min(30vw,220px);min-width:132px;border-radius:16px;padding:10px 9px 12px;
  background:linear-gradient(180deg,rgba(48,30,78,.92),rgba(18,11,32,.96));
  border:1px solid rgba(255,255,255,.11);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:7px;transition:transform .18s var(--ease),border-color .2s,box-shadow .25s;
  position:relative;overflow:hidden;cursor:pointer;
}
.pick-card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 0%,rgba(180,120,255,.22),transparent 70%);pointer-events:none}
.pick-card:hover{transform:translateY(-6px)}
.pick-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,201,106,.5),0 0 40px rgba(245,201,106,.32),var(--shadow);transform:translateY(-6px) scale(1.02)}
.pick-card .pc-art{position:relative;border-radius:11px;overflow:hidden}
.pick-card h3{margin:0;font-size:14px;text-align:center;line-height:1.3}
.pick-card .role{font-size:10.5px;color:var(--gold);text-align:center;letter-spacing:1.2px;margin-top:-3px}
.pick-card .sk{font-size:11.5px;color:#c3b2e2;line-height:1.5;min-height:50px}
.pick-card .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tag{font-size:10px;padding:2.5px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:#d8c9f0;border:1px solid rgba(255,255,255,.09);white-space:nowrap}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.center-col .big-pic{font-size:44px;filter:drop-shadow(0 8px 18px rgba(180,120,255,.5))}
.nick-box{width:min(340px,86vw);display:flex;flex-direction:column;gap:10px;margin-top:4px}
.nick-box input{
  width:100%;padding:15px 16px;border-radius:14px;background:rgba(10,6,20,.85);color:#fff;
  border:1px solid rgba(255,255,255,.16);font-size:17px;text-align:center;font-family:inherit;outline:none;letter-spacing:1px;
  transition:border-color .2s,box-shadow .2s;
}
.nick-box input::placeholder{color:#6b5c8a;letter-spacing:0}
.nick-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,201,106,.15)}

/* ════════════════ 4 · 로비 ════════════════ */
#scrLobby{background:linear-gradient(180deg,rgba(13,8,25,.65),rgba(6,4,14,.9))}
.lobby-top{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(38,22,64,.92),rgba(16,10,30,.86));backdrop-filter:blur(8px);z-index:5}
.lobby-user{display:flex;align-items:center;gap:9px;min-width:0}
.avatar-frame{position:relative;width:44px;height:44px;flex:0 0 auto;border-radius:13px;padding:2px;
  background:linear-gradient(160deg,#ffe6ab,#b8862f 50%,#5c3a10);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.avatar-frame canvas{width:100%;height:100%;border-radius:11px;background:#0b0616}
.lobby-user .who{min-width:0}
.lobby-user b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;letter-spacing:.2px}
.lobby-user span{font-size:10.5px;color:var(--muted);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.cur{display:flex;gap:5px;margin-left:auto;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:6px 9px;border-radius:10px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pill i{font-style:normal;font-size:11px}
.pill.g{color:#ffd97a}.pill.s{color:#8fd8ff}.pill.d{color:#ff9fc4}
.lobby-tabs{position:relative;display:flex;gap:5px;padding:9px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(180deg,rgba(12,7,24,.6),rgba(12,7,24,0))}
.lobby-tabs::-webkit-scrollbar{display:none}
.ltab{flex:0 0 auto;padding:8px 11px;border-radius:11px;font-size:12.5px;font-weight:800;color:#b9a6d8;
  background:rgba(255,255,255,.035);border:1px solid transparent;transition:.16s;display:flex;gap:5px;align-items:center;white-space:nowrap}
.ltab:hover{color:#e2d6ff;background:rgba(255,255,255,.07)}
.ltab.on{background:linear-gradient(180deg,rgba(140,80,255,.9),rgba(70,32,150,.95));color:#fff;border-color:rgba(196,164,255,.55);
  box-shadow:0 4px 18px rgba(120,60,230,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.lobby-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 30px;-webkit-overflow-scrolling:touch}
.panel{position:relative;background:linear-gradient(180deg,rgba(36,23,62,.82),rgba(16,10,30,.88));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.panel::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:
    radial-gradient(60% 50% at 0% 0%,rgba(160,110,255,.13),transparent 60%),
    radial-gradient(50% 50% at 100% 100%,rgba(245,201,106,.07),transparent 60%)}
.panel>*{position:relative}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:7px;letter-spacing:.2px}
.panel h2 .sub{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 10px}
.stat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stat{font-size:11px;padding:5px 9px;border-radius:9px;background:rgba(0,0,0,.34);border:1px solid var(--line-gold);color:#e6d8ff}
.stat b{color:var(--gold2)}

/* 스토리 */
.chapter-list{display:flex;flex-direction:column;gap:8px}
.chap{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;padding:9px;border-radius:13px;
  background:linear-gradient(100deg,rgba(52,33,86,.75),rgba(20,12,36,.7));border:1px solid var(--line);
  cursor:pointer;transition:transform .14s,border-color .2s,box-shadow .2s}
.chap:hover{transform:translateX(2px);border-color:rgba(245,201,106,.3)}
.chap.locked{opacity:.45;cursor:default}
.chap.locked:hover{transform:none;border-color:var(--line)}
.chap .thumb{width:74px;height:54px;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.14);position:relative;flex:0 0 auto}
.chap .thumb canvas{width:100%;height:100%}
.chap .ci{min-width:0}
.chap .ci b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .ci span{font-size:11px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .prog{height:4px;border-radius:4px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden}
.chap .prog i{display:block;height:100%;background:linear-gradient(90deg,#f5c96a,#ff8a3d);box-shadow:0 0 8px rgba(245,201,106,.7)}
.chap .cnt{font-size:11px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap;min-width:34px}
.chap .cnt b{display:inline;color:var(--gold2);font-size:13px}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.stage{position:relative;aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#33205a,#1b102e);border:1px solid rgba(255,255,255,.1);font-weight:800;font-size:14px;
  cursor:pointer;transition:transform .12s,box-shadow .2s;overflow:hidden}
.stage:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.stage small{font-size:8px;color:#b49fd0;font-weight:700;letter-spacing:.3px}
.stage.lock{opacity:.28;pointer-events:none}
.stage.done{background:linear-gradient(180deg,#245038,#13291f);border-color:rgba(92,224,138,.35)}
.stage.done::after{content:"✓";position:absolute;top:1px;right:3px;font-size:8.5px;color:#7ff0a8}
.stage.elite{background:linear-gradient(180deg,#5a3296,#2f1a56);border-color:rgba(180,123,255,.6)}
.stage.boss{background:linear-gradient(180deg,#8e2338,#4a1020);border-color:rgba(255,138,152,.7)}
.stage.cur{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(245,201,106,.55);animation:stagePulse 2s ease-in-out infinite}
@keyframes stagePulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(245,201,106,.4)}50%{box-shadow:0 0 0 2px var(--gold2),0 0 26px rgba(245,201,106,.8)}}
.stage-info{margin-top:12px;padding:13px;border-radius:15px;background:linear-gradient(180deg,rgba(52,32,88,.92),rgba(18,11,32,.96));border:1px solid var(--line-gold);
  box-shadow:0 14px 30px rgba(0,0,0,.4);animation:modalIn .24s var(--ease)}
.stage-info .row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.stage-info .row b{font-size:16px}
.stage-info p{margin:4px 0 10px;font-size:12.5px;color:#d3c4ec;line-height:1.55}
.foe-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.foe-chip{font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:flex;gap:5px;align-items:center}
.foe-chip canvas{width:22px;height:22px}

/* 아레나 */
.tier-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:10px}
.tier-row::-webkit-scrollbar{display:none}
.tier{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#c8b8e4}
.tier.on{background:linear-gradient(180deg,#ffe6ab,#e3ad42);color:#3a2200;border-color:#fff3cd;box-shadow:0 4px 14px rgba(245,201,106,.35)}
.rival{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:13px;
  background:linear-gradient(100deg,rgba(52,33,86,.7),rgba(20,12,36,.7));border:1px solid var(--line);margin-bottom:8px}
.rival canvas{width:52px;height:52px;background:radial-gradient(circle at 50% 60%,#2a1a44,#0a0614);border-radius:11px;border:1px solid rgba(255,255,255,.12)}
.rival .ri{min-width:0}
.rival .ri b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival .ri span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.rival .ri .bar{height:4px;border-radius:4px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden}
.rival .ri .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5cff,#4fb6ff)}

/* 가챠 탭 */
.summon-banner{position:relative;overflow:hidden;border-radius:18px;padding:20px 14px 16px;text-align:center;margin-bottom:12px;
  background:
    radial-gradient(90% 120% at 50% 0%,rgba(180,90,255,.4),transparent 60%),
    radial-gradient(80% 90% at 90% 100%,rgba(79,182,255,.25),transparent 60%),
    linear-gradient(180deg,#2a1450,#120820 75%);
  border:1px solid rgba(200,150,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 40px rgba(0,0,0,.45)}
.summon-banner .rings{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.summon-banner .rings i{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(220,180,255,.28);transform:translate(-50%,-50%)}
.summon-banner .rings i:nth-child(1){width:210px;height:210px;animation:spin 22s linear infinite;border-style:dashed}
.summon-banner .rings i:nth-child(2){width:300px;height:300px;animation:spin 36s linear infinite reverse;border-color:rgba(245,201,106,.2)}
.summon-banner .rings i:nth-child(3){width:150px;height:150px;animation:spin 16s linear infinite;border-color:rgba(120,200,255,.25)}
.summon-banner .rings i:nth-child(4){width:400px;height:400px;opacity:.5;animation:spin 60s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.summon-banner .kicker{position:relative;font-size:10px;letter-spacing:4px;color:#ffd8a8;text-transform:uppercase}
.summon-banner h3{position:relative;margin:6px 0 4px;font-size:19px;letter-spacing:-.2px;
  background:linear-gradient(180deg,#fff8e6,#f5c96a 60%,#c08a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.summon-banner p{position:relative;margin:0 0 12px;font-size:12px;color:#d6c6ee}
.gacha-btns{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rate{position:relative;font-size:10.5px;color:#9d8dbd;margin-top:10px;line-height:1.7}
.pity{position:relative;margin-top:10px;font-size:11px;color:#cbb8e8}
.pity .bar{height:5px;border-radius:5px;background:rgba(0,0,0,.5);margin-top:5px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.pity .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5f9e,#ffc44d)}
.rates-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.rate-cell{border-radius:9px;padding:6px 4px;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);font-size:10px}
.rate-cell b{display:block;font-size:11px;margin-bottom:1px}

/* 보유/덱 카드 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.card{position:relative;border-radius:11px;overflow:hidden;aspect-ratio:11/15;background:#0a0614;cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .2s;box-shadow:0 6px 16px rgba(0,0,0,.45);isolation:isolate}
.card canvas{width:100%;height:100%;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.55)}
.card .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.5;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.42) 42%,rgba(255,255,255,.06) 50%,transparent 62%);
  background-size:260% 260%;animation:foilMove 6s linear infinite}
@keyframes foilMove{0%{background-position:120% 120%}100%{background-position:-40% -40%}}
.card.r-일반 .foil{opacity:.1}
.card.r-희귀 .foil{opacity:.25}
.card.r-영웅 .foil{opacity:.38}
.card.r-전설 .foil{opacity:.55}
.card.r-신화 .foil{opacity:.75;background:
  linear-gradient(115deg,transparent 20%,rgba(255,140,200,.42) 36%,rgba(140,220,255,.4) 48%,rgba(255,240,160,.42) 60%,transparent 76%);
  background-size:260% 260%;animation:foilMove 4s linear infinite}
.card .badge-lv{position:absolute;left:3px;top:3px;font-size:8.5px;font-weight:900;background:rgba(4,2,10,.8);
  padding:1.5px 5px;border-radius:5px;border:1px solid rgba(255,255,255,.2);color:#ffe9a8;z-index:3}
.card .badge-dup{position:absolute;right:3px;top:3px;font-size:8.5px;font-weight:900;background:linear-gradient(180deg,#ffe6ab,#e0a52c);color:#3a2200;padding:1.5px 5px;border-radius:5px;z-index:3}
.badge-new{position:absolute;right:3px;top:3px;font-size:8px;font-weight:900;background:linear-gradient(180deg,#ff7a9a,#e01f45);color:#fff;
  padding:1.5px 5px;border-radius:5px;letter-spacing:.5px;z-index:4;box-shadow:0 0 12px rgba(255,60,100,.7);animation:newPulse 1.4s ease-in-out infinite}
@keyframes newPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.card .badge-deck{position:absolute;left:3px;bottom:3px;font-size:8px;font-weight:900;background:rgba(245,201,106,.92);color:#3a2200;padding:1.5px 5px;border-radius:5px;z-index:3}
.card.in-deck{outline:2px solid var(--gold);outline-offset:-2px}
.card .lock-veil{position:absolute;inset:0;background:rgba(4,2,10,.6);display:flex;align-items:center;justify-content:center;font-size:20px;color:#6a5a8a;z-index:2}
.deck-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.deck-slots .slot{position:relative;aspect-ratio:11/15;border-radius:9px;border:1px dashed rgba(255,255,255,.2);
  background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#6f5e90;cursor:pointer;overflow:hidden;
  transition:border-color .2s,box-shadow .2s}
.deck-slots .slot:hover{border-color:rgba(245,201,106,.5)}
.deck-slots .slot .card{position:absolute;inset:0;border-radius:9px;box-shadow:none}
.deck-slots .slot .slot-nm{position:absolute;left:0;right:0;bottom:0;z-index:3;font-size:8px;line-height:1.2;text-align:center;padding:8px 1px 2px;background:linear-gradient(0deg,rgba(4,2,10,.95),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2eaff}
.deck-slots .slot .rm{position:absolute;right:2px;top:2px;z-index:4;width:15px;height:15px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);font-size:9px;display:flex;align-items:center;justify-content:center;color:#ffb0c0}
.deck-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ════════════════ 5 · 전투 ════════════════ */
#scrBattle{background:#05030b}
.b-top{display:flex;align-items:center;gap:7px;padding:6px 10px;
  background:linear-gradient(180deg,rgba(34,20,58,.97),rgba(12,7,22,.94));border-bottom:1px solid rgba(255,255,255,.08);z-index:6;flex:0 0 auto}
.b-top .bt{flex:1;min-width:0}
.b-top b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.b-top span{font-size:10.5px;color:#a893c8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-field{position:relative;flex:1;min-height:0;overflow:hidden;background:#0a0614;touch-action:manipulation}
#field{position:absolute;inset:0;width:100%;height:100%}
.field-hud{position:absolute;inset:0;pointer-events:none}
.field-log{position:absolute;left:9px;top:9px;max-width:72%;font-size:11px;line-height:1.5;color:#fff;
  text-shadow:0 1px 3px #000,0 0 8px #000;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.field-log div{opacity:0;animation:logIn .3s forwards;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent);padding:1px 6px 1px 0;border-radius:4px}
.field-log div:last-child{color:#fff8e0}
@keyframes logIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.boss-warn{position:absolute;left:0;right:0;top:36%;display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:7}
.boss-warn.on{display:flex;animation:warnIn 2.4s ease forwards}
.boss-warn .wline{width:100%;height:2px;background:linear-gradient(90deg,transparent,#ff5468,transparent);box-shadow:0 0 18px #ff5468}
.boss-warn b{font-size:clamp(18px,5vw,30px);letter-spacing:3px;color:#ffdfe4;text-shadow:0 0 18px #ff2040,0 2px 0 #400;padding:4px 18px;
  background:linear-gradient(90deg,transparent,rgba(40,0,10,.85),transparent)}
.boss-warn span{font-size:11.5px;letter-spacing:5px;color:#ff9aa8}
@keyframes warnIn{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.turn-banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;z-index:6;
  font-size:clamp(20px,6vw,34px);font-weight:900;letter-spacing:6px;color:#fff8e0;
  text-shadow:0 0 22px rgba(245,201,106,.9),0 3px 0 rgba(60,30,0,.8);opacity:0}
.turn-banner.show{animation:turnIn 1.15s var(--ease) forwards}
@keyframes turnIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5);filter:blur(6px)}25%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
.arena-chip{position:absolute;right:9px;top:9px;font-size:10px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.55);
  border:1px solid var(--line-gold);color:#ffe9b8;pointer-events:none;z-index:4}
.b-hand{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:7px 6px 5px;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(30,17,50,.98),rgba(14,8,26,.99));border-top:1px solid rgba(255,255,255,.07);
  perspective:900px}
.hcard{position:relative;min-width:0;border-radius:9px;overflow:hidden;background:#0a0614;border:1px solid rgba(255,255,255,.1);
  aspect-ratio:11/15;cursor:pointer;transition:transform .18s var(--ease),box-shadow .2s,filter .2s;touch-action:manipulation;
  transform-style:preserve-3d;will-change:transform}
.hcard canvas{position:absolute;inset:0;width:100%;height:100%}
.hcard .hinfo{position:absolute;left:0;right:0;bottom:0;padding:14px 2px 3px;text-align:center;
  background:linear-gradient(0deg,rgba(0,0,0,.95) 40%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;font-weight:800;line-height:1.1}
.hcard .hcond{position:absolute;left:2px;top:2px;font-size:7.5px;font-weight:900;padding:1px 4px;border-radius:5px;
  background:rgba(4,2,10,.85);border:1px solid rgba(255,255,255,.22);color:#efe6ff;z-index:3}
.hcard .huses{position:absolute;right:2px;top:2px;font-size:7.5px;font-weight:900;padding:1px 3.5px;border-radius:5px;
  background:rgba(4,2,10,.85);border:1px solid rgba(255,255,255,.18);color:#ffe9a8;z-index:3}
.hcard .heff{position:absolute;left:0;right:0;bottom:13px;text-align:center;font-size:7.5px;color:#ffe9a8;
  text-shadow:0 1px 3px #000;z-index:3;font-weight:700}
.hcard.ready{border-color:rgba(245,201,106,.9);box-shadow:0 0 0 1px rgba(245,201,106,.7),0 0 16px rgba(245,201,106,.45)}
.hcard.ready::after{content:"";position:absolute;inset:-1px;border-radius:9px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,240,200,.35),transparent 35%,transparent 65%,rgba(255,240,200,.25));opacity:.7}
.hcard.no{filter:grayscale(.7) brightness(.62)}
.hcard.sel{transform:translateY(-9px) scale(1.05);box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 22px rgba(245,201,106,.7);z-index:4}
.hcard.up{animation:cardUp .2s var(--ease)}
@keyframes cardUp{from{transform:translateY(10px) scale(.94);opacity:.4}to{transform:none;opacity:1}}
.hcard.fire{animation:cardFire .38s var(--ease)}
@keyframes cardFire{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-2.5deg);box-shadow:0 0 34px #ffd873,0 0 60px rgba(255,180,60,.6)}100%{transform:scale(1)}}
.hcard .shine{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .2s;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%)}
.hcard:hover .shine{opacity:.75}
.b-bottom{display:flex;align-items:center;gap:6px;padding:7px 8px 8px;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(20,12,34,.98),rgba(8,5,16,.99));border-top:1px solid rgba(255,255,255,.06)}
.b-portrait{position:relative;width:56px;height:56px;flex:0 0 auto}
.b-portrait canvas{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 36%,#3b2462,#0d0718);
  border:2px solid rgba(245,201,106,.55);box-shadow:0 0 16px rgba(0,0,0,.6),inset 0 0 12px rgba(0,0,0,.6)}
.b-portrait .ring{position:absolute;inset:-4px;transform:rotate(-90deg);width:calc(100% + 8px);height:calc(100% + 8px)}
.b-portrait .ring circle{fill:none;stroke-width:3.4;stroke-linecap:round;transition:stroke-dashoffset .35s}
.b-portrait .hpnum{position:absolute;left:-4px;right:-4px;bottom:-3px;text-align:center;font-size:9.5px;font-weight:900;color:#ffe9a8;
  text-shadow:0 1px 4px #000;letter-spacing:.2px}
.b-gems{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap;min-width:0}
.gem{position:relative;width:clamp(26px,7.6vw,42px);height:clamp(28px,8.2vw,46px);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .14s var(--ease),opacity .2s,filter .2s;flex:0 0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.gem svg{position:absolute;inset:0;width:100%;height:100%}
.gem span{position:relative;font-weight:900;font-size:clamp(11px,3.2vw,15px);color:#141020;text-shadow:0 1px 0 rgba(255,255,255,.6);pointer-events:none}
.gem:hover{transform:translateY(-2px)}
.gem.sel{transform:translateY(-7px) scale(1.12);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #ffe9a8)}
.gem.used{opacity:.2;pointer-events:none;transform:scale(.76);filter:grayscale(1)}
.gem.pop{animation:gemPop .3s var(--ease)}
@keyframes gemPop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.endturn{
  position:relative;width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 30%,#fff6d8,#ffe6ab 25%,#f5c96a 48%,#b8862f 100%);
  border:2px solid #fff8df;box-shadow:0 3px 0 #6d4408,0 0 24px rgba(245,201,106,.45),inset 0 1px 0 #fff;
  color:#4a2c00;font-size:22px;font-weight:900;transition:transform .1s,box-shadow .2s}
.endturn:active{transform:translateY(2px) scale(.96)}
.endturn.pulse{animation:etPulse 1.8s ease-in-out infinite}
@keyframes etPulse{0%,100%{box-shadow:0 3px 0 #6d4408,0 0 16px rgba(245,201,106,.4)}50%{box-shadow:0 3px 0 #6d4408,0 0 34px rgba(245,201,106,.95)}}
.endturn small{position:absolute;bottom:7px;font-size:7px;letter-spacing:.5px;opacity:.7}
.guide{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:92%;
  background:linear-gradient(180deg,rgba(24,14,40,.97),rgba(10,6,20,.97));border:1px solid var(--line-gold);border-radius:14px;padding:11px 15px;
  font-size:12.5px;line-height:1.55;box-shadow:0 12px 34px rgba(0,0,0,.7);z-index:9;text-align:center;
  animation:guideIn .32s var(--ease);pointer-events:none;color:#f0e6ff}
@keyframes guideIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.guide b{color:var(--gold)}
.guide .finger{display:inline-block;animation:pointBounce .9s ease-in-out infinite}
@keyframes pointBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tut-skip{position:absolute;right:8px;top:8px;z-index:10;font-size:10.5px;padding:5px 9px;border-radius:8px;
  background:rgba(4,2,10,.7);border:1px solid rgba(255,255,255,.16);color:#cbb8e8;backdrop-filter:blur(4px)}

/* ════════════════ 5-B · v3 전투 UI (마나 · EX · 체인 · 브레이크) ════════════════ */
.b-mana{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.b-mana .orbs{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap}
.b-mana .orb{display:block;width:clamp(11px,3.2vw,17px);height:clamp(14px,4vw,21px);
  background:linear-gradient(180deg,rgba(90,130,180,.22),rgba(24,34,60,.4));border:1px solid rgba(140,190,255,.22);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background .25s,box-shadow .25s,transform .25s}
.b-mana .orb.on{background:linear-gradient(180deg,#d8f6ff,#5ab8ff 55%,#2a6fd0);border-color:#e6f7ff;
  box-shadow:0 0 9px rgba(90,190,255,.85);transform:scale(1.04)}
.b-mana .orb.bonus.on{background:linear-gradient(180deg,#fff6d8,#ffc44d 55%,#c08a20);border-color:#fff8e0;
  box-shadow:0 0 10px rgba(255,200,90,.9)}
.b-mana .mnum{font-size:9px;font-weight:800;color:#a8d8ff;letter-spacing:.2px;line-height:1}
.b-mana .mnum b{font-size:12px;color:#fff;font-weight:900}
.b-mana .mnum span{opacity:.6}
.exbtn{position:relative;width:50px;height:50px;flex:0 0 auto;border-radius:50%;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f5c96a;
  border:2px solid rgba(245,201,106,.32);box-shadow:inset 0 0 14px rgba(0,0,0,.7);transition:border-color .2s}
.exbtn::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:0;
  background:conic-gradient(from -90deg,#ffe9a8 var(--od,0%),rgba(255,255,255,.05) 0)}
.exbtn::after{content:"";position:absolute;inset:4px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 50% 38%,#2c1844,#0b0616 78%)}
.exbtn .exlabel,.exbtn .expct{position:relative;z-index:2;line-height:1.05}
.exbtn .exlabel{font-size:14px;font-weight:900;letter-spacing:1px}
.exbtn .expct{font-size:8px;font-weight:800;opacity:.75}
.exbtn.ready{border-color:#fff6d8;color:#fff;animation:exReady 1.15s ease-in-out infinite}
@keyframes exReady{0%,100%{box-shadow:0 0 12px rgba(255,220,120,.45),inset 0 0 14px rgba(0,0,0,.7)}50%{box-shadow:0 0 30px rgba(255,225,140,.95),inset 0 0 14px rgba(0,0,0,.7)}}
.b-portrait .odring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);overflow:visible}
.b-portrait .odring circle{fill:none;stroke-width:2.6;stroke-linecap:round;transition:stroke-dashoffset .3s,stroke .3s}
.hcard .hcost{position:absolute;left:2px;top:2px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#eaf6ff;z-index:3;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#dff2ff,#3f86d8 62%,#12365f);
  border:1px solid rgba(220,245,255,.9);box-shadow:0 0 8px rgba(90,180,255,.65)}
.hcard .hcost.c4,.hcard .hcost.c5{color:#2a1600;background:radial-gradient(circle at 34% 28%,#fff6d8,#e8a93a 62%,#7a4a08);
  border-color:#fff8e0;box-shadow:0 0 9px rgba(255,200,90,.85)}
.hcard .helem{position:absolute;right:3px;top:2px;font-size:9.5px;line-height:1;z-index:3;filter:drop-shadow(0 1px 2px #000)}
.chain-badge{position:absolute;right:9px;top:38px;display:flex;align-items:baseline;gap:3px;padding:2px 8px;border-radius:10px;
  background:linear-gradient(180deg,rgba(44,22,74,.92),rgba(12,6,22,.92));border:1px solid rgba(245,201,106,.55);
  color:#ffe9a8;opacity:0;transform:translateX(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.chain-badge.on{opacity:1;transform:none}
.chain-badge b{font-size:17px;font-weight:900;line-height:1;color:#fff6d8;text-shadow:0 0 10px rgba(245,201,106,.9)}
.chain-badge span{font-size:7.5px;letter-spacing:1.4px;font-weight:800}
.chain-badge.pop{animation:chainPop .38s var(--ease)}
@keyframes chainPop{0%{transform:scale(1.4)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.combo-banner{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);transition:opacity .22s;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 18px;border-radius:14px;pointer-events:none;z-index:8;opacity:0;white-space:nowrap;
  background:linear-gradient(180deg,rgba(62,28,94,.94),rgba(16,8,26,.95));border:1px solid var(--line-gold);
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px rgba(245,201,106,.3)}
.combo-banner.on{opacity:1;animation:comboPop .42s var(--ease)}
.combo-banner b{font-size:clamp(15px,4.4vw,21px);font-weight:900;letter-spacing:2px;color:#fff6d8;text-shadow:0 0 14px rgba(255,200,100,.9)}
.combo-banner span{font-size:10px;color:#dcccf8}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.78)}55%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1)}}
.break-banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:9;opacity:0;transition:opacity .2s}
.break-banner.on{opacity:1;animation:breakPop .5s var(--ease)}
.break-banner b{display:block;font-size:clamp(30px,10vw,52px);font-weight:900;letter-spacing:3px;font-style:italic;color:#fff3c0;
  text-shadow:0 0 24px #ffb020,0 0 48px #ff8a00,0 4px 0 #6a3a00;line-height:1.05}
.break-banner span{font-size:10px;letter-spacing:1.6px;color:#ffe9a8}
@keyframes breakPop{0%{transform:translate(-50%,-50%) scale(1.7) rotate(-4deg);filter:blur(8px)}
  55%{transform:translate(-50%,-50%) scale(1) rotate(0);filter:blur(0)}100%{filter:blur(0)}}
.excut{position:absolute;inset:0;pointer-events:none;z-index:11;opacity:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 50% 50%,rgba(60,20,0,.55),transparent 62%)}
.excut.on{animation:exCutIn 2.3s ease forwards}
.excut .exrays{position:absolute;width:180%;aspect-ratio:1;background:repeating-conic-gradient(from 0deg,rgba(255,225,150,.26) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 18%,transparent 60%);mask-image:radial-gradient(circle,#000 18%,transparent 60%);animation:exSpin 2.6s linear}
.excut .exword{position:relative;font-size:clamp(24px,8vw,44px);font-weight:900;letter-spacing:5px;font-style:italic;color:#fff6d8;
  text-shadow:0 0 20px #ffb020,0 0 46px #ff7a00,0 3px 0 #5a2a00}
.excut .exsub{position:relative;font-size:clamp(10px,3vw,13px);letter-spacing:4px;color:#ffe9a8;font-weight:800}
@keyframes exSpin{to{transform:rotate(360deg)}}
@keyframes exCutIn{0%{opacity:0;transform:scale(1.3)}8%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#btnAuto{width:auto;min-width:38px;padding:0 8px;font-size:9.5px;font-weight:900;letter-spacing:.4px}
#btnAuto.on{background:linear-gradient(180deg,rgba(92,224,138,.32),rgba(18,70,44,.65));border-color:rgba(92,224,138,.85);color:#dcffe8}

/* ════════════════ 6 · 모달 / 토스트 ════════════════ */
#ovl{position:absolute;inset:0;display:none;z-index:120;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,2,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ovl.on{display:flex}
.modal{width:min(540px,94vw);max-height:88vh;overflow-y:auto;border-radius:20px;padding:18px;
  background:linear-gradient(180deg,#281646,#120a22 70%);border:1px solid var(--line-gold);
  box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12);animation:modalIn .26s var(--ease)}
.modal.wide{width:min(680px,96vw)}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 10px;font-size:18px;text-align:center;letter-spacing:-.2px}
.modal h2 .gold-txt{font-size:13px;font-weight:800}
.modal p{font-size:13px;color:#d6c6ee;line-height:1.65;margin:0 0 12px}
.modal .mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.modal textarea{width:100%;height:88px;border-radius:11px;background:#0b0618;color:#cfe;border:1px solid var(--line);
  padding:9px;font-family:var(--mono);font-size:11px;resize:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);z-index:300;
  padding:10px 16px;border-radius:12px;background:rgba(16,9,30,.97);border:1px solid var(--line-gold);
  font-size:12.5px;font-weight:800;color:#ffe9a8;opacity:0;transition:.26s var(--ease);pointer-events:none;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ════════════════ 7 · 소환 연출 ════════════════ */
#cinema{position:fixed;inset:0;z-index:200;display:none;background:#030208;overflow:hidden;touch-action:manipulation}
#cinema.on{display:block}
#cinema .cin-bg{position:absolute;inset:0;background:
  radial-gradient(60% 45% at 50% 45%,rgba(60,24,110,.55),transparent 70%),
  radial-gradient(80% 60% at 50% 110%,rgba(90,20,120,.35),transparent 70%),
  linear-gradient(180deg,#05030c,#020106)}
#cinema .cin-canvas{position:absolute;inset:0;width:100%;height:100%}
#cinema .cin-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
#cinema .cin-flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;mix-blend-mode:screen}
#cinema .cin-flash.go{animation:flashOut .55s ease-out forwards}
@keyframes flashOut{0%{opacity:.95}100%{opacity:0}}
#cinema .cin-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:10px}
.cin-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 14px;z-index:5}
.cin-top .ct{flex:1;font-size:11px;letter-spacing:2px;color:#b9a6d8;text-transform:uppercase}
.cin-skip{padding:7px 12px;border-radius:9px;font-size:11.5px;font-weight:800;color:#d8c9f0;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.cin-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 18px 70px}
.cin-kicker{font-size:10px;letter-spacing:5px;color:#c9a8ff;text-transform:uppercase;opacity:.9}
.cin-title{font-size:clamp(20px,6vw,32px);font-weight:900;letter-spacing:1px;text-align:center;
  background:linear-gradient(180deg,#fff8e0,#f5c96a 60%,#b8862f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(245,201,106,.45));opacity:0;animation:fadeUp .6s .15s var(--ease) forwards}
.cin-sub{font-size:12.5px;color:#e4d8ff;text-align:center;line-height:1.6;opacity:0;animation:fadeUp .6s .35s var(--ease) forwards;max-width:330px;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.8)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cin-hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:11.5px;color:#b7a4d8;
  animation:hintBlink 2s ease-in-out infinite;pointer-events:none}
@keyframes hintBlink{0%,100%{opacity:.55}50%{opacity:1}}
.cin-orbit{position:relative;width:min(76vw,320px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.cin-orbit canvas{position:absolute;inset:0;width:100%;height:100%}
.cin-orb{width:78px;height:78px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 35%,#fff,#ffe6ab 25%,#f5c96a 50%,#7a3fe0 85%);
  box-shadow:0 0 40px rgba(245,201,106,.8),0 0 90px rgba(150,80,255,.6);animation:orbPulse 1.6s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.12);filter:brightness(1.25)}}
.cin-orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(255,233,168,.5);animation:orbRing 1.8s ease-out infinite}
@keyframes orbRing{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* 빔 단계 */
.cin-beam-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cin-beam{width:min(34vw,160px);height:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 40%,var(--aura,#ffe6ab));
  filter:blur(1px);box-shadow:0 0 60px var(--aura,#ffe6ab),0 0 160px var(--aura,#ffe6ab);opacity:0}
.cin-beam.fire{animation:beamUp 1.5s var(--ease) forwards}
@keyframes beamUp{0%{height:0;opacity:0}25%{height:110vh;opacity:1}70%{opacity:1;width:min(34vw,160px)}100%{height:110vh;opacity:0;width:min(50vw,260px)}}
.cin-burst-ring{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;border:2px solid var(--aura,#ffe6ab);
  transform:translate(-50%,-50%);opacity:0;box-shadow:0 0 40px var(--aura,#ffe6ab)}
.cin-burst-ring.go{animation:ringOut 1.1s ease-out forwards}
@keyframes ringOut{0%{width:10px;height:10px;opacity:1;border-width:14px}100%{width:160vmax;height:160vmax;opacity:0;border-width:1px}}
.cin-cutin{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:26px 0;background:linear-gradient(180deg,transparent,rgba(2,1,6,.72) 22%,rgba(2,1,6,.78) 78%,transparent)}
.cin-cutin .ci-line{height:1px;background:linear-gradient(90deg,transparent,var(--aura,#ffe6ab),transparent);margin:6px 0;opacity:.8}
.cin-cutin b{display:block;font-size:clamp(18px,5.2vw,28px);letter-spacing:7px;color:#fff;text-shadow:0 0 26px var(--aura,#ffe6ab),0 2px 0 #000}
.cin-cutin span{display:block;font-size:11px;letter-spacing:6px;color:var(--aura,#ffe6ab);margin-top:4px;text-shadow:0 2px 8px #000}

/* 카드 뒤집기 단계 */
.cin-cards{position:relative;display:grid;gap:7px;width:min(760px,94vw);justify-content:center;perspective:1200px;z-index:2}
.cin-cards.one{grid-template-columns:minmax(0,190px)}
.cin-cards.many{grid-template-columns:repeat(5,minmax(0,1fr))}
.gcard{position:relative;aspect-ratio:11/15;transform-style:preserve-3d;transition:transform .62s var(--ease);cursor:pointer}
.gcard.flipped{transform:rotateY(180deg)}
.gcard .gface{position:absolute;inset:0;border-radius:11px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.6)}
.gcard .gfront{transform:rotateY(180deg)}
.gcard .gback{background:linear-gradient(160deg,#3b1f6b,#170c2c 70%);border:1px solid rgba(200,160,255,.4);display:flex;align-items:center;justify-content:center}
.gcard .gback::before{content:"";position:absolute;inset:5px;border-radius:8px;border:1px solid rgba(245,201,106,.3)}
.gcard .gback::after{content:"";position:absolute;inset:0;background:
  repeating-conic-gradient(from 0deg,rgba(180,120,255,.14) 0deg 8deg,transparent 8deg 24deg);
  border-radius:11px;opacity:.7}
.gcard .gback canvas{width:100%;height:100%;display:block}
.gcard .gback i{display:none}
.gcard .gface canvas{width:100%;height:100%;display:block}
.gcard .gglow{position:absolute;inset:-4px;border-radius:15px;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:0 0 14px var(--gc,#fff);z-index:-1}
.gcard.flipped .gglow{opacity:.5}
.gcard.flipped .gfront{box-shadow:0 0 16px var(--gc,#fff)}
.gcard.legend .gfront,.gcard.myth .gfront{animation:legendShake .5s .35s}
@keyframes legendShake{0%,100%{transform:rotateY(180deg)}30%{transform:rotateY(180deg) translateX(-4px)}60%{transform:rotateY(180deg) translateX(4px)}}
.gcard .gnew{position:absolute;left:4px;bottom:4px;font-size:8.5px;font-weight:900;background:linear-gradient(180deg,#ff7a9a,#e01f45);
  color:#fff;padding:2px 6px;border-radius:6px;letter-spacing:.5px;z-index:4;box-shadow:0 0 12px rgba(255,60,100,.7)}
.gcard .gdup{position:absolute;left:4px;bottom:4px;font-size:8px;font-weight:800;background:rgba(4,2,10,.85);
  color:#cbb8e8;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.2);z-index:4}
.cin-progress{font-size:11px;color:#b7a4d8;letter-spacing:1px}
.cin-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:3}
.cin-summary{width:min(560px,94vw);max-height:74vh;overflow-y:auto;padding:4px 2px 8px;z-index:2}
.cin-summary .sum-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.cin-summary .sum-head h3{margin:0;font-size:18px}
.cin-summary .sum-head span{margin-left:auto;font-size:11px;color:var(--muted)}
.sum-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0 12px}
.sum-item{display:flex;gap:7px;align-items:center;padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);font-size:11.5px}
.sum-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.sum-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-item .q{font-size:9.5px;color:var(--muted)}
.sum-totals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sum-total{font-size:11px;padding:4px 9px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.sum-reward{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px;border-radius:10px;
  background:rgba(245,201,106,.08);border:1px solid rgba(245,201,106,.2);font-size:12px;margin-bottom:10px}

/* 팩 */
.pack-scene{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.pack{position:relative;width:132px;height:184px;border-radius:14px;cursor:pointer;
  background:linear-gradient(155deg,#7a3fe0 0%,#3a1a6e 45%,#12081f 100%);
  border:1px solid rgba(245,201,106,.7);box-shadow:0 0 40px rgba(245,201,106,.35),0 22px 40px rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;animation:packFloat 2.6s ease-in-out infinite;overflow:hidden}
.pack::before{content:"";position:absolute;inset:6px;border-radius:10px;border:1px solid rgba(255,233,168,.35)}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);
  background-size:250% 250%;animation:foilMove 4s linear infinite}
.pack .seal{font-size:48px;filter:drop-shadow(0 0 18px rgba(245,201,106,.9))}
.pack .pname{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:900;color:#ffe9a8;letter-spacing:2px}
.pack.open{animation:packBurst .7s var(--ease) forwards}
@keyframes packBurst{0%{transform:scale(1)}45%{transform:scale(1.14);filter:brightness(2)}100%{transform:scale(1.9);opacity:0;filter:brightness(3)}}
@keyframes packFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}

/* ════════════════ 8 · 반응형 ════════════════ */
@media (min-width:720px){
  #app{max-width:1180px;margin:0 auto;left:0;right:0;box-shadow:0 0 120px rgba(0,0,0,.85)}
  body{background:#05030b}
  .b-hand{gap:8px;padding:10px 14px 7px;max-width:820px;margin:0 auto;width:100%}
  .hcard .hinfo{font-size:9.5px;padding:14px 2px 4px}
  .hcard .hcond,.hcard .huses{font-size:9px}
  .hcard .hcost{width:20px;height:20px;font-size:11px}
  .exbtn{width:58px;height:58px}
  .hcard .heff{font-size:9px;bottom:16px}
  .b-portrait,.b-portrait canvas{width:68px;height:68px}
  .endturn{width:66px;height:66px;font-size:25px}
  .lobby-body{padding:16px 20px 40px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .stage-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .deck-slots{grid-template-columns:repeat(6,minmax(0,1fr))}
  .cin-cards.many{grid-template-columns:repeat(5,minmax(0,140px))}
  .cin-cards.one{grid-template-columns:minmax(0,230px)}
  .field-log{font-size:12.5px}
}
@media (max-height:640px){
  .b-hand{padding:4px 5px 3px;gap:4px}
  .b-bottom{padding:4px 6px 5px}
  .b-portrait,.b-portrait canvas{width:44px;height:44px}
  .endturn{width:46px;height:46px;font-size:18px}
  .b-top{padding:4px 8px}
  .title-emblem{width:min(210px,52vw);height:min(210px,52vw)}
}
@media (max-width:360px){
  .gem{width:24px;height:26px}
  .b-portrait,.b-portrait canvas{width:48px;height:48px}
  .endturn{width:50px;height:50px;font-size:19px}
  .exbtn{width:44px;height:44px}
  .b-mana .orb{width:11px;height:14px}
  .cin-cards.many{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
}
</style>
</head>
<body>
<div id="bgFx"><canvas id="bgCanvas"></canvas></div>
<div id="app">

  <!-- ══ 타이틀 ══ -->
  <section class="screen on" id="scrTitle">
    <div class="title-emblem">
      <canvas id="titleCircle" width="600" height="600"></canvas>
      <div class="tc" id="titleCards" style="display:flex;gap:6px;filter:drop-shadow(0 16px 26px rgba(0,0,0,.7))"></div>
    </div>
    <div class="kicker">Infinite Card Saga</div>
    <div class="title-logo">무한의 군주</div>
    <p class="title-sub">카드의 왕이 금단의 카드를 열었다.<br>수천억 장의 카드가 차원 너머로 흩어졌다.</p>
    <div class="title-actions">
      <button class="btn gold lg block" id="btnStart">⚔️ 모험 시작</button>
      <button class="btn ghost block" id="btnContinue" style="display:none">이어하기</button>
    </div>
    <div class="title-foot">30 CHAPTERS · 900 STAGES · 39 CARDS</div>
  </section>

  <!-- ══ 스타터 선택 ══ -->
  <section class="screen" id="scrStarter">
    <div class="screen-head">
      <div class="h-kicker">Prologue · 01</div>
      <h1>운명의 카드 3장</h1>
      <p>무한의 군주가 남긴 세 장의 봉인 카드.<br>한 장만이 너의 손에 깨어난다.</p>
    </div>
    <div class="starter-row" id="starterRow"></div>
    <div style="padding:4px 16px 22px;text-align:center;flex:0 0 auto">
      <button class="btn gold lg" id="btnPickConfirm" disabled style="min-width:220px">이 카드로 시작하기</button>
    </div>
  </section>

  <!-- ══ 닉네임 ══ -->
  <section class="screen" id="scrNick">
    <div class="center-col">
      <div class="big-pic">🃏</div>
      <div class="kicker">Prologue · 02</div>
      <h1 style="margin:0;font-size:23px">카드 소환사의 이름</h1>
      <p class="muted" style="font-size:13px;margin:0">차원의 기록에 새겨질 이름을 알려줘.</p>
      <div class="nick-box">
        <input id="nickInput" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="off" spellcheck="false">
        <button class="btn primary block" id="btnNickOk">이름 정하기</button>
      </div>
    </div>
  </section>

  <!-- ══ 로비 ══ -->
  <section class="screen" id="scrLobby">

      <div class="lobby-user">
        <div class="avatar-frame"><canvas id="userAvatar" width="88" height="88"></canvas></div>

      </div>
      <div class="cur">
        <div class="pill g"><i>🪙</i><span id="curGold">0</span></div>
        <div class="pill s"><i>💎</i><span id="curShard">0</span></div>
      </div>
    </div>
    <div class="lobby-tabs" id="lobbyTabs"></div>
    <div class="lobby-body" id="lobbyBody"></div>
  </section>

  <!-- ══ 전투 ══ -->
  <section class="screen" id="scrBattle">
    <div class="b-top">
      <button class="icobtn" id="btnQuit">✕</button>
      <div class="bt"><b id="bTitle">1-1 시작의 초원</b><span id="bSub">스테이지</span></div>
      <button class="icobtn" id="btnSpeed">1×</button>
      <button class="icobtn" id="btnAuto">AUTO</button>
      <button class="icobtn" id="btnMute">🔊</button>
    </div>
    <div class="b-field" id="fieldWrap">
      <canvas id="field" width="400" height="300"></canvas>
      <div class="field-hud"><div class="field-log" id="fieldLog"></div></div>
      <div class="turn-banner" id="turnBanner"></div>
      <div class="chain-badge" id="chainBadge"></div>
      <div class="combo-banner" id="comboBanner"></div>
      <div class="break-banner" id="breakBanner"></div>

      <div class="b-portrait">
        <svg class="odring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34" stroke="rgba(245,201,106,.16)"></circle><circle id="odRing" cx="36" cy="36" r="34" stroke="#f5c96a" stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle></svg>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" stroke="rgba(255,255,255,.12)"></circle><circle id="hpRing" cx="32" cy="32" r="28" stroke="#5ce08a" stroke-dasharray="175.9" stroke-dashoffset="0"></circle></svg>
        <canvas id="portrait" width="112" height="112"></canvas>
        <div class="hpnum" id="hpNum">70/70</div>
      </div>
      <div class="b-mana" id="manaEl"></div>
      <button class="exbtn" id="exBtn"><span class="exlabel">EX</span><span class="expct">0%</span></button>
      <button class="endturn" id="endTurn">▶<small>TURN</small></button>
    </div>

const BG = (() => {
  let cvs = null, g = null, raf = null, motes = [], stars = [], last = 0;
  function init() {
    cvs = $('bgCanvas'); if (!cvs) return;
    g = cvs.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 46; i++) motes.push(newMote(true));
    loop(performance.now());
  }
  function resize() {
    const r = cvs.getBoundingClientRect();
    cvs.width = Math.max(1, Math.floor(r.width)); cvs.height = Math.max(1, Math.floor(r.height));
    const rnd2 = mulberry(77);
    stars = [];
    for (let i = 0; i < 90; i++) stars.push({ x: rnd2(), y: rnd2() * .85, r: rnd2() * 1.4 + .3, a: rnd2() * .5 + .15, p: rnd2() * 6.28 });
  }
  function newMote(any) {
    const W = cvs ? cvs.width : 400, H = cvs ? cvs.height : 800;
    return { x: Math.random() * W, y: any ? Math.random() * H : H + 12, r: rndF(.6, 2.1), s: rndF(.08, .3), a: rndF(.15, .5), p: rndF(0, 6.28), c: pick(['#c9a8ff', '#f5c96a', '#7fd4ff', '#ff8ac0']) };
  }
  function draw(t) {
    if (!g) return;
    const W = cvs.width, H = cvs.height;
    g.clearRect(0, 0, W, H);
    stars.forEach(s => {
      const a = s.a * (.55 + .45 * Math.sin(t * .001 + s.p));
      g.fillStyle = 'rgba(255,245,220,' + a.toFixed(3) + ')';
      g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 7); g.fill();
    });
    motes.forEach(m => {
      m.y -= m.s * (H / 900) * 1.2; m.x += Math.sin(t * .0006 + m.p) * .25;
      if (m.y < -10) { Object.assign(m, newMote(false)); }
      g.fillStyle = hexA(m.c, m.a * .55);
      g.beginPath(); g.arc(m.x, m.y, m.r, 0, 7); g.fill();
    });
  }
  function loop(t) {
    if (t - last > 32) { draw(t); last = t; }
    raf = requestAnimationFrame(loop);
  }
  return { init };
})();

function autoDesc(c) {
  const nm = (ELEM[c.el] || ELEM.arcane).name;
  let t;
  switch (c.eff) {
    case 'dmg': t = '단일 ' + c.val + ' 피해'; break;
    case 'pierce': t = '방어 무시 ' + c.val + ' 피해'; break;
    case 'multi': t = (c.val >= 7 ? 3 : 2) + '회 ' + c.val + ' 피해'; break;
    case 'all': t = '모든 적 ' + c.val + ' 피해'; break;
    case 'block': t = '방어 ' + c.val; break;
    case 'guard': t = '방어 ' + c.val + ' + 회복 ' + Math.round(c.val * .5); break;
    case 'heal': t = '체력 ' + c.val + ' 회복'; break;
    case 'drain': t = c.val + ' 피해 + ' + Math.round(c.val * .6) + ' 회복'; break;
    case 'poison': t = '독 ' + c.val + ' (3턴)'; break;
    case 'stun': t = c.val + ' 피해 + 기절'; break;
    case 'buff': t = '공격력 +' + c.val + ' (전투)'; break;
    case 'reroll': t = '마나 ' + (c.val + 1) + ' 회복 + 드로우'; break;
    case 'gold': t = '🪙 ' + c.val + ' + 2 피해'; break;
    case 'genesis': t = c.val + ' 피해 + 드로우'; break;
    default: t = '효과';
  }
  return nm + ' · ' + t;
}
CARDS.forEach(c => { c.desc = autoDesc(c); });

/* 부드러운 닫힌 곡선 (Catmull-Rom → Bezier) */
function curvePath(g, p, closed) {
  const n = p.length; if (n < 2) return;
  g.beginPath(); g.moveTo(p[0][0], p[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    g.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
      p2[0], p2[1]
    );
  }
  if (closed) g.closePath();
}
function poly(g, p, fill, stroke, lw) {
  g.beginPath(); g.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
}
function vgrad(g, y0, y1, c0, c1) { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; }
function rgrad(g, x, y, r, c0, c1) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; }
function star4(g, x, y, r, col, a) {
  g.save(); g.globalAlpha = a == null ? 1 : a; g.fillStyle = col;
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 4;
    const rad = i % 2 ? r * .28 : r;
    const px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fill(); g.restore();
}
function glowEye(g, x, y, r, col) {
  g.save();
  g.shadowColor = col; g.shadowBlur = r * 7;
  g.fillStyle = col;
  g.beginPath(); g.ellipse(x, y, r, r * .72, 0, 0, 7); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(x, y, r * .42, 0, 7); g.fill();
  g.restore();
}

/* ── 문양/시길 ── */
function drawSigil(g, cx, cy, r, seed, col, t) {
  const rand = mulberry(seed);
  const spin = t == null ? 0 : t * .00012;
  g.save(); g.translate(cx, cy);
  g.strokeStyle = hexA(col, .5); g.lineWidth = Math.max(.7, r * .012);
  for (let ring = 0; ring < 3; ring++) {
    const rr2 = r * (1 - ring * .18);
    g.globalAlpha = .5 - ring * .1;
    g.beginPath(); g.arc(0, 0, rr2, 0, 7); g.stroke();
  }
  g.globalAlpha = .45;
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = spin + i * (Math.PI * 2 / n);
    const r1 = r * .82, r2 = r * .94;
    g.beginPath();
    g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    g.stroke();
  }
  // 시길 글리프
  g.globalAlpha = .5; g.lineWidth = Math.max(.8, r * .018);
  for (let i = 0; i < 3; i++) {
    const a0 = rand() * 6.28, rad = r * (.35 + rand() * .3);
    const ax = Math.cos(a0) * rad, ay = Math.sin(a0) * rad;
    const len = r * (.12 + rand() * .2);
    g.beginPath();
    g.moveTo(ax, ay);
    g.lineTo(ax + Math.cos(a0 + 1.3) * len, ay + Math.sin(a0 + 1.3) * len);
    g.lineTo(ax + Math.cos(a0 + 2.1) * len * .7, ay + Math.sin(a0 + 2.1) * len * .7);
    g.stroke();
  }
  // 중앙 삼각/별
  g.globalAlpha = .35;
  g.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * 2.094 + spin * 2;
    const px = Math.cos(a) * r * .55, py = Math.sin(a) * r * .55;

function wrapLines(g, text, maxW, font, maxLines) {

    const test = cur + ch;

    else cur = test;

  return lines;

/* ── 턴 ── */
function startTurn(first) {
  if (!B) return;
  if (!first) B.turn++; else B.turn = 1;
  // 플레이어 독
  if (B.player.poisT > 0) {
    const d = B.player.pois;
    B.player.hp = Math.max(0, B.player.hp - d);
    B.player.poisT--;
    addPop(heroPos().x, heroPos().y - B.vh * .3, '-' + d, '#9ae070', 1, false);
    addParts(heroPos().x, heroPos().y - B.vh * .2, '#9ae070', 14, 'poison');
    SFX.poison();
    logMsg('독 ' + d + ' 피해');
    if (B.player.hp <= 0) { setTimeout(() => { if (B && B.phase !== 'end') lose(); }, T(420)); }
  }
  // 마나 회복 (턴마다 최대치 +, 매 턴 완충)
  B.player.manaMax = Math.min(8, 4 + Math.floor((B.turn - 1) / 3));
  B.player.mana = B.player.manaMax;
  B.chain = 0; B.lastEl = null;
  // 핸드 보충
  while (B.hand.length < 6) {
    if (!B.deck.length) { B.deck = shuffle(B.pile); B.pile = []; if (!B.deck.length) break; }
    B.hand.push(B.deck.pop());
  }
  if (B.cfg.tut && !B.hand.some(id => CARD_BY[id] && cardCost(CARD_BY[id]) <= B.player.mana)) {
    if (!B.hand.includes('c_slime')) { if (!B.hand.length) B.hand.push('c_slime'); else B.hand[0] = 'c_slime'; }
    else if (!B.hand.includes('c_farmer')) { if (!B.hand.length) B.hand.push('c_farmer'); else B.hand[0] = 'c_farmer'; }
  }
  B.phase = 'play';
  renderMana(); renderHand(); updateHud(); updateChain(); updateExBtn(); updateAutoBtn();
  logMsg('— ' + B.turn + '턴 — 마나 ' + B.player.mana);
  if (!first) { showBanner('TURN ' + B.turn); SFX.turn(); }
  // 적 예고
  B.foes.forEach(f => {
    if (f.hp > 0 && !f.broken) { f.pendingAct = f.act; f.tele = 0; }
  });
  if (B.auto) scheduleAuto();
}

function autoStep() {

  if (B.phase !== 'play') return;
  if (B.player.od >= 100) { fireEX(); return; }
  const idxs = playableCards();
  if (idxs.length) {
    const t = curTarget();
    let best = -1, bestSc = -1e9;
    idxs.forEach(i => {
      const c = CARD_BY[B.hand[i]]; if (!c) return;
      const el = c.el || 'arcane';
      const atk = ['dmg', 'pierce', 'multi', 'all', 'drain', 'genesis', 'stun'].indexOf(c.eff) >= 0;
      let sc = 0;
      if (atk) sc += 30;

/* ── 필드 레이아웃 / 입력 ── */
window.fitField = function () {
  const cvs = $('field'), wrap = $('fieldWrap');
  if (!cvs || !wrap || !B) return;
  const r = wrap.getBoundingClientRect();
  if (r.width < 20 || r.height < 20) return;
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  B.vw = r.width; B.vh = r.height; B.dpr = dpr;
  cvs.width = Math.round(r.width * dpr); cvs.height = Math.round(r.height * dpr);
  layoutFoes();
};
function layoutFoes() {
  if (!B) return;
  const W = B.vw, H = B.vh;
  const fs = B.foes.filter(f => f.hp > 0 || f.dying);
  const count = B.foes.length;
  fs.forEach((f, i) => {
    if (count === 1) { f.h = Math.min(H * (B.boss ? .5 : .4), W * .4); f.x = W * .68; f.y = H * .8; }
    else if (count === 2) { f.h = Math.min(H * .27, W * .2) * (f.boss ? 1.3 : f.elite ? 1.15 : 1); f.x = W * (.55 + i * .28); f.y = H * (.78 + (i % 2) * .05); }
    else { f.h = Math.min(H * .235, W * .17) * (f.boss ? 1.35 : 1); f.x = W * (.48 + i * .185); f.y = H * (.73 + (i % 2) * .09); }
  });
}
function bindFieldTap() {
  const cvs = $('field'); if (!cvs) return;
  cvs.onclick = ev => {
    if (!B || B.phase === 'end') return;
    const r = cvs.getBoundingClientRect();
    if (r.width < 10) return;
    const x = (ev.clientX - r.left) * (B.vw / r.width);
    const y = (ev.clientY - r.top) * (B.vh / r.height);
    let bestI = -1, bestD = 1e9;
    B.foes.forEach((f, i) => {
      if (f.hp <= 0) return;
      const dx = Math.abs(x - f.x), dy = y - (f.y - f.h * .45);
      if (dx < f.h * .44 && Math.abs(dy) < f.h * .5) {
        const d = dx + Math.abs(dy) * .55;
        if (d < bestD) { bestD = d; bestI = i; }
      }
    });
    if (bestI >= 0) {
      B.target = bestI;
      const f = B.foes[bestI];
      addRing(f.x, f.y - f.h * .45, '#ff5468', f.h * .2, f.h * .55, 460, 3);
      addPop(f.x, f.y - f.h * .92, '🎯 TARGET', '#ff8a98', .95);
      SFX.ui(); logMsg('🎯 ' + f.name + ' 지정');
    }
  };
}

/* ── 전투 렌더 ── */
function stopBattleLoop() {
  if (battleRAF) { cancelAnimationFrame(battleRAF); battleRAF = null; }
  if (B) { B.auto = false; clearTimeout(B.autoTimer); }
}
function battleLoop(t) {
  if (!B) { stopBattleLoop(); return; }
  if (curScreen === 'scrBattle') drawBattle(t);
  battleRAF = requestAnimationFrame(battleLoop);
}
function drawBattle(t) {
  if (!B) return;
  const cvs = $('field'); if (!cvs) return;
  if (!B.vw) fitField();
  const W = B.vw, H = B.vh, dpr = B.dpr || 1;
  if (!W || !H) return;
  const g = cvs.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  // 흔들림
  let shx = 0, shy = 0;
  if (B.shake > 0) {
    shx = (Math.random() - .5) * B.shake; shy = (Math.random() - .5) * B.shake;
    B.shake *= .88; if (B.shake < .3) B.shake = 0;
  }
  g.save();
  g.translate(shx, shy);
  // 배경
  const base = fieldBase(B.cfg.theme, W, H, dpr);
  g.drawImage(base, 0, 0, W, H);
  const fogA = .06 + .03 * Math.sin(t * .0004);
  g.fillStyle = hexA((THEME_ART[B.cfg.theme] || THEME_ART.grass).fog, fogA);
  g.beginPath(); g.ellipse(W * .5 + Math.sin(t * .0002) * W * .1, H * .66, W * .75, H * .09, 0, 0, 7); g.fill();
  // 환경 입자
  if (!B.amb.length) for (let i = 0; i < 22; i++) B.amb.push({ x: rndF(0, W), y: rndF(0, H), r: rndF(.7, 2.2), s: rndF(.1, .5), p: rndF(0, 6.28) });
  const themeMote = (THEME_ART[B.cfg.theme] || THEME_ART.grass).mote;
  B.amb.forEach(a => {
    a.y -= a.s; a.x += Math.sin(t * .0007 + a.p) * .25;
    if (a.y < -4) { a.y = H + 4; a.x = rndF(0, W); }
    g.fillStyle = hexA(themeMote, .35);
    g.beginPath(); g.arc(a.x, a.y, a.r, 0, 7); g.fill();
  });
  // 폭풍 섬광
  if ((B.cfg.theme === 'storm' || B.cfg.theme === 'blood') && Math.random() < .004) {
    g.fillStyle = 'rgba(210,225,255,.16)'; g.fillRect(0, 0, W, H);
  }

  const hp = heroPos();
  const heroCard = CARD_BY[S.starter] || CARDS[0];
  const heroH = Math.min(H * .36, W * .3);
  // 타겟 링
  const tgt = B.foes[B.target];
  if (tgt && tgt.hp > 0) {
    const tr = tgt.h * .34 + Math.sin(t * .005) * 3;
    g.save(); g.translate(tgt.x, tgt.y); g.scale(1, .42);
    g.strokeStyle = hexA('#ff5468', .5 + .22 * Math.sin(t * .006)); g.lineWidth = 3;
    g.setLineDash([8, 7]); g.lineDashOffset = -t * .02;
    g.beginPath(); g.arc(0, 0, tr, 0, 7); g.stroke(); g.setLineDash([]);
    g.restore();
  }
  // 히어로 그림자
  g.fillStyle = 'rgba(0,0,0,.38)';
  g.beginPath(); g.ellipse(hp.x, hp.y + 2, heroH * .26, heroH * .07, 0, 0, 7); g.fill();
  // 히어로
  let lungeX = 0;
  if (B.hero.lunge) {
    const p = (performance.now() - B.hero.lunge) / 380;
    if (p >= 1) B.hero.lunge = null;
    else lungeX = Math.sin(Math.PI * clamp(p, 0, 1)) * W * .09;
  }
  const breathe = Math.sin(t * .002) * .012;
  g.save();
  g.translate(hp.x + lungeX, hp.y);
  g.rotate(lungeX / W * .35);
  g.scale(1 + breathe, 1 + breathe);
  paintFigure(g, heroCard, 0, 0, heroH / 68, { t: t, aura: .2 });
  if (B.hero.flash > 0) {
    g.globalAlpha = B.hero.flash * .55; g.fillStyle = '#ff4050';
    g.beginPath(); g.ellipse(0, -heroH * .45, heroH * .3, heroH * .4, 0, 0, 7); g.fill();
    g.globalAlpha = 1; B.hero.flash -= .06;
  }
  g.restore();
  // 내 방어막
  if (B.player.block > 0) {
    const r = heroH * .42 + Math.sin(t * .004) * 3;
    g.strokeStyle = hexA('#7fd4ff', .75); g.lineWidth = 2.5;
    g.save(); g.shadowColor = '#7fd4ff'; g.shadowBlur = 12;
    g.beginPath(); g.arc(hp.x, hp.y - heroH * .42, r, 0, 7); g.stroke();
    g.restore();
    g.fillStyle = '#bfeaff'; g.font = '900 ' + Math.max(10, H * .028) + 'px ' + FONT; g.textAlign = 'center';
    g.fillText('🛡' + B.player.block, hp.x, hp.y - heroH * .42 - r - 6);
  }
  if (B.player.atkBuff > 0) {
    g.fillStyle = '#ffd08a'; g.textAlign = 'center';
    g.font = '900 ' + Math.max(9, H * .024) + 'px ' + FONT;
    g.fillText('⚔+' + B.player.atkBuff, hp.x + heroH * .28, hp.y - heroH * .55);
  }
  // 전경 풀숲 (깊이감)
  drawForeground(g, W, H, B.cfg.theme, t);
  // 적
  layoutFoes();
  B.foes.forEach((f, i) => {
    const dead = f.hp <= 0;
    let alpha = 1;
    if (dead) {
      if (!f.dying) return;
      const p = (performance.now() - f.dying) / 700;
      if (p >= 1) return;
      alpha = 1 - p;
    }
    let lunge = 0;
    if (f.lunge) {
      const p = (performance.now() - f.lunge) / 360;
      if (p >= 1) f.lunge = null;
      else lunge = -Math.sin(Math.PI * clamp(p, 0, 1)) * W * .05;
    }
    let knock = 0;

    g.beginPath(); g.ellipse(f.x + lunge + knock, f.y + 2, f.h * .24, f.h * .06, 0, 0, 7); g.fill();
    if (f.flash > 0) f.flash -= .07;
    drawCreature(g, f.kind, f.x + lunge + knock, f.y, f.h, { t: t, boss: f.boss, elite: f.elite, flash: Math.max(0, f.flash), phase: f.phase });

      g.globalAlpha = .5 + .3 * Math.sin(t * .01);
      g.strokeStyle = '#ffe08a'; g.lineWidth = 2.4;
      g.shadowColor = '#ffb020'; g.shadowBlur = 14;
      g.setLineDash([9, 7]); g.lineDashOffset = t * .03;
      g.beginPath(); g.arc(0, 0, rr2, 0, 7); g.stroke();

/* ══════════════ 06 · 소환 연출 (가챠 시네마틱) ══════════════ */
const Gacha = {
  active: false, stage: '', n: 0, got: [], opts: {}, revealed: 0, maxOrder: 0,
  raf: null, timers: [], sparks: [], bursts: [], t0: 0, cvs: null, g: null, W: 0, H: 0, dpr: 1,
  maxRare: '일반', done: false

const RARITY_AURA = { '일반': '#dfe6f5', '희귀': '#5ec8ff', '영웅': '#b47bff', '전설': '#ffd45e', '신화': '#ff6bb0' };

function cineResize() {
  const cvs = $('cinCanvas'); if (!cvs) return;
  Gacha.dpr = Math.min(2.5, window.devicePixelRatio || 1);
  Gacha.W = window.innerWidth; Gacha.H = window.innerHeight;
  cvs.width = Math.round(Gacha.W * Gacha.dpr); cvs.height = Math.round(Gacha.H * Gacha.dpr);
}
function cineClearTimers() { Gacha.timers.forEach(t => clearTimeout(t)); Gacha.timers = []; }
function cineLater(fn, ms) { const id = setTimeout(fn, ms); Gacha.timers.push(id); return id; }

function cineOpen(got, opts) {
  opts = opts || {};
  Gacha.active = true; Gacha.done = false;
  Gacha.got = got; Gacha.opts = opts; Gacha.n = got.length;
  Gacha.revealed = 0;
  Gacha.maxOrder = got.reduce((a, x) => Math.max(a, RARITY[CARD_BY[x.id].rare].order), 0);
  Gacha.maxRare = RARITY_ORDER[Gacha.maxOrder];
  const aura = RARITY_AURA[Gacha.maxRare] || '#ffd45e';
  document.documentElement.style.setProperty('--aura', aura);
  $('cinema').style.setProperty('--aura', aura);
  $('cinema').classList.add('on');
  $('cinTopLabel').textContent = opts.mode === 'pack' ? 'STARTER PACK' : 'DIMENSIONAL SUMMON';
  cineResize();
  Gacha.cvs = $('cinCanvas'); Gacha.g = Gacha.cvs.getContext('2d');
  Gacha.sparks = [];
  for (let i = 0; i < 160; i++) Gacha.sparks.push({ a: Math.random() * 6.283, r: Math.random(), sp: .25 + Math.random() * .7, sz: 1 + Math.random() * 2.4, hue: Math.random() });
  Gacha.bursts = [];
  $('cinUi').innerHTML = '';
  Gacha.stage = '';
  cineCharge();
  cineLoop(performance.now());
  window.addEventListener('resize', cineResize);
  $('cinSkip').onclick = cineSkip;
}
function cineClose() {
  Gacha.active = false;
  if (Gacha.raf) cancelAnimationFrame(Gacha.raf);
  Gacha.raf = null;
  cineClearTimers();
  $('cinema').classList.remove('on');
  $('cinUi').innerHTML = '';
  window.removeEventListener('resize', cineResize);
  const cb = Gacha.opts.onDone;
  if (typeof cb === 'function') cb();
}
function cineSkip() {
  if (!Gacha.active) return;
  SFX.ui();
  if (Gacha.stage === 'charge' || Gacha.stage === 'burst') { cineRevealStage(); return; }
  if (Gacha.stage === 'flip') { revealAll(true); return; }
  if (Gacha.stage === 'summary') { cineClose(); return; }
}
function cineLoop(now) {
  if (!Gacha.active) return;
  drawCine(now);
  Gacha.raf = requestAnimationFrame(cineLoop);
}
function drawCine(now) {
  const g = Gacha.g; if (!g) return;
  const W = Gacha.W, H = Gacha.H;
  g.setTransform(Gacha.dpr, 0, 0, Gacha.dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * .46;
  const aura = RARITY_AURA[Gacha.maxRare] || '#ffd45e';
  const el = now - Gacha.t0;
  if (Gacha.stage === 'charge') {
    const R = Math.min(W, H) * .33;
    // 바닥 광
    g.save();
    g.fillStyle = rgrad(g, cx, cy + R * .35, R * 1.5, hexA(aura, .2), hexA(aura, 0));
    g.fillRect(0, 0, W, H);
    // 회전 마법진
    g.globalCompositeOperation = 'lighter';
    g.save(); g.translate(cx, cy);
    for (let k = 0; k < 3; k++) {
      g.save();
      g.rotate(now * (.00012 + k * .00007) * (k % 2 ? -1 : 1));
      g.strokeStyle = hexA(k === 1 ? '#ffffff' : aura, .5 - k * .12); g.lineWidth = 1.4;

        g.beginPath();

      g.beginPath();
      const sides = k === 0 ? 3 : k === 1 ? 6 : 4;
      for (let i = 0; i < sides; i++) {
        const a = -Math.PI / 2 + i * 6.283 / sides;
        const px = Math.cos(a) * rad * .7, py = Math.sin(a) * rad * .7;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.stroke();
      g.restore();
    }
    g.restore();
    // 수렴 입자
    Gacha.sparks.forEach(s => {
      const prog = ((now * .00035 * s.sp + s.r) % 1);
      const rad = R * (1 - prog) * 1.35;
      const a = s.a + prog * 2.4;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * .62;
      g.fillStyle = hexA(s.hue > .5 ? aura : '#ffffff', (1 - prog) * .9);

    });
    // 오브
    const pulse = 1 + Math.sin(now * .006) * .09;
    const orbR = Math.min(W, H) * .075 * pulse;
    g.fillStyle = rgrad(g, cx, cy, orbR * 3.4, hexA('#ffffff', .85), hexA(aura, .25));
    g.beginPath(); g.arc(cx, cy, orbR * 3.4, 0, 7); g.fill();
    g.fillStyle = rgrad(g, cx, cy, orbR, '#ffffff', hexA(aura, .6));
    g.beginPath(); g.arc(cx, cy, orbR, 0, 7); g.fill();
    g.strokeStyle = hexA('#ffffff', .85); g.lineWidth = 1.6;
    g.beginPath(); g.arc(cx, cy, orbR * (1.25 + .12 * Math.sin(now * .008)), 0, 7); g.stroke();
    // 빛줄기
    g.globalCompositeOperation = 'lighter';
    const lw = orbR * 5;
    const lg = g.createLinearGradient(cx, cy - H, cx, cy);
    lg.addColorStop(0, hexA(aura, 0)); lg.addColorStop(1, hexA(aura, .18));
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(cx - lw * .18, cy); g.lineTo(cx - lw, 0); g.lineTo(cx + lw, 0); g.lineTo(cx + lw * .18, cy); g.closePath(); g.fill();
    g.restore();
  } else if (Gacha.stage === 'burst') {

    const p = clamp(e / 1800, 0, 1);
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = rgrad(g, cx, cy, Math.max(W, H) * (.2 + p * .7), hexA(aura, .55 * (1 - p * .65)), hexA(aura, 0));
    g.fillRect(0, 0, W, H);
    // 빔 (소프트 라이트 필러)
    const grow = p < .16 ? p / .16 : 1;
    const fade = 1 - Math.max(0, p - .62) / .38;
    const bw = Math.min(W * .16, 96) * grow;

    pillar.addColorStop(0, hexA(aura, 0));

    pillar.addColorStop(.36, hexA(aura, .30 * fade));
    pillar.addColorStop(.45, hexA(aura, .55 * fade));
    pillar.addColorStop(.5, hexA('#ffffff', .95 * fade));
    pillar.addColorStop(.55, hexA(aura, .55 * fade));
    pillar.addColorStop(.64, hexA(aura, .30 * fade));
    pillar.addColorStop(.78, hexA(aura, .10 * fade));
    pillar.addColorStop(1, hexA(aura, 0));
    g.fillStyle = pillar;

    const vfade = g.createLinearGradient(0, 0, 0, H);
    vfade.addColorStop(0, 'rgba(0,0,0,.9)'); vfade.addColorStop(.32, 'rgba(0,0,0,0)');
    vfade.addColorStop(.78, 'rgba(0,0,0,0)'); vfade.addColorStop(1, 'rgba(0,0,0,.75)');
    g.fillStyle = vfade;
    g.fillRect(cx - bw * 2.4, 0, bw * 4.8, H);

      if (q <= 0 || q >= 1) continue;
      g.strokeStyle = hexA(i % 2 ? '#ffffff' : aura, (1 - q) * .85);
      g.lineWidth = 8 * (1 - q) + .5;
      g.beginPath(); g.arc(cx, cy, 10 + q * Math.max(W, H) * .95, 0, 7); g.stroke();
    }
    // 폭발 입자
    Gacha.sparks.forEach((s, i) => {
      if (i % 2) return;
      const q = clamp((e - 120) / 1500, 0, 1);
      const rad = 20 + q * Math.max(W, H) * (.35 + s.sp * .5);
      const a = s.a + q * .4;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * .8 + q * q * 120;
      g.fillStyle = hexA(i % 3 ? aura : '#ffffff', (1 - q) * .9);
      g.beginPath(); g.arc(x, y, s.sz * (1.4 - q), 0, 7); g.fill();
    });
    g.restore();
    // 플래시
    if (e < 260) {
      g.fillStyle = hexA('#ffffff', .8 * (1 - e / 260));
      g.fillRect(0, 0, W, H);
    }
  } else {
    // flip / summary: 은은한 배경
    g.save();
    g.fillStyle = rgrad(g, cx, H * .45, Math.min(W, H) * .7, hexA(aura, .12), 'rgba(0,0,0,0)');
    g.fillRect(0, 0, W, H);
    Gacha.sparks.forEach((s, i) => {
      if (i > 60) return;
      const y = ((now * .02 * s.sp + s.r * H) % H);
      const x = (s.a / 6.283) * W + Math.sin(now * .001 + s.a) * 12;
      g.fillStyle = hexA('#ffffff', .12 + (i % 5) * .03);
      g.beginPath(); g.arc(x, H - y, s.sz * .7, 0, 7); g.fill();
    });
    g.restore();
  }
}
