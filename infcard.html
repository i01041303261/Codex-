<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>무한의 군주 — 카드 RPG</title>
<meta name="description" content="무한의 군주: 카드를 뽑고, 젬을 골라 스킬을 터뜨리는 픽셀 판타지 카드 RPG. 30챕터 × 30스테이지 스토리, 카드 소환·덱 편성·아레나 대전.">
<meta name="theme-color" content="#120a20">
<style>
:root{
  --bg:#120a20; --bg2:#1b0f2e; --panel:#241639; --panel2:#2e1c47;
  --gold:#f6c453; --gold2:#ffe9a8; --ink:#f2e9ff; --muted:#b49fd0;
  --line:rgba(255,255,255,.10); --line2:rgba(246,196,83,.35);
  --red:#ff5a6e; --green:#5ce08a; --blue:#5ab8ff; --violet:#a86bff;
  --font:"Trebuchet MS","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(120% 90% at 50% 0%,#2a1546 0%,#160c28 45%,#0b0614 100%);
  color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;word-break:keep-all;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ── 공용 버튼 ───────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:12px;font-weight:800;font-size:15px;
  background:linear-gradient(180deg,#3a2560,#261644);color:#efe4ff;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 3px 0 #150b25,0 8px 20px rgba(0,0,0,.4);
  transition:transform .08s,filter .15s;letter-spacing:.2px;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #150b25}
.btn.gold{background:linear-gradient(180deg,#ffd873,#e0a52c);color:#3a2200;border-color:#ffe9a8;box-shadow:0 3px 0 #8a5f12,0 8px 22px rgba(246,196,83,.3)}
.btn.primary{background:linear-gradient(180deg,#8b4bff,#5b28c9);border-color:#b18cff;box-shadow:0 3px 0 #2b1160,0 8px 22px rgba(139,75,255,.35)}
.btn.ghost{background:rgba(255,255,255,.06)}
.btn.danger{background:linear-gradient(180deg,#e6394a,#a11224);border-color:#ff8a98}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.42;filter:grayscale(.5);pointer-events:none}

/* ── 타이틀 ───────────────────────────── */
#scrTitle{align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.title-logo{
  font-size:clamp(30px,8vw,58px);font-weight:900;letter-spacing:-1px;line-height:1.05;
  background:linear-gradient(180deg,#fff8dd 10%,#f6c453 45%,#b06b1d 78%,#ffe9a8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3a1d00) drop-shadow(0 0 26px rgba(246,196,83,.45));
}
.title-sub{color:#d9c4ff;font-size:13px;letter-spacing:3px;text-transform:uppercase}
.title-cards{display:flex;gap:10px;margin:6px 0 4px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))}
.title-cards canvas{width:64px;height:84px;border-radius:6px;animation:floaty 3.4s ease-in-out infinite}
.title-cards canvas:nth-child(2){animation-delay:.5s;transform:translateY(-6px)}
.title-cards canvas:nth-child(3){animation-delay:1s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title-foot{position:absolute;bottom:16px;font-size:11px;color:#8a76a8}

/* ── 스타터 선택 ───────────────────────── */
.screen-head{padding:18px 16px 8px;text-align:center}
.screen-head h1{margin:0;font-size:clamp(19px,5vw,26px);letter-spacing:-.3px}
.screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.starter-row{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px 20px;flex-wrap:wrap;align-content:center;overflow-y:auto}
.pick-card{
  width:min(31vw,240px);min-width:150px;border-radius:16px;padding:10px 9px 12px;
  background:linear-gradient(180deg,rgba(58,34,92,.9),rgba(28,16,46,.95));
  border:2px solid rgba(255,255,255,.12);box-shadow:0 14px 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:7px;transition:transform .16s,border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;cursor:pointer;
}
.pick-card:hover{transform:translateY(-5px)}
.pick-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(246,196,83,.35),0 0 34px rgba(246,196,83,.45),0 14px 30px rgba(0,0,0,.5)}
.pick-card canvas{width:100%;height:auto;aspect-ratio:3/4;border-radius:10px;display:block;background:#0d0718}
.pick-card h3{margin:0;font-size:15px;text-align:center}
.pick-card .role{font-size:11px;color:var(--gold);text-align:center;margin-top:-4px;letter-spacing:1px}
.pick-card .sk{font-size:11.5px;color:#cbb8e8;line-height:1.45;min-height:52px}
.pick-card .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.09);color:#d8c9f0;border:1px solid rgba(255,255,255,.08)}
.pick-card .pickhint{position:absolute;inset:auto 0 0;height:0;background:linear-gradient(0deg,rgba(246,196,83,.95),rgba(246,196,83,0));transition:height .18s;pointer-events:none}
.pick-card.sel .pickhint{height:100%;opacity:.10}

/* ── 닉네임 ───────────────────────────── */
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.nick-box{width:min(360px,86vw);display:flex;flex-direction:column;gap:10px}
.nick-box input{
  width:100%;padding:14px 16px;border-radius:14px;background:#160c26;color:#fff;
  border:2px solid rgba(255,255,255,.14);font-size:17px;text-align:center;font-family:inherit;outline:none;
}
.nick-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.18)}

/* ── 로비 ───────────────────────────── */
#scrLobby{background:linear-gradient(180deg,#1a0f2c,#0e0819)}
.lobby-top{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(56,30,92,.9),rgba(26,15,44,.9));
}
.lobby-user{display:flex;align-items:center;gap:8px;min-width:0}
.lobby-user canvas{width:34px;height:34px;border-radius:9px;background:#0c0616;border:1px solid var(--line2)}
.lobby-user b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.lobby-user span{font-size:10.5px;color:var(--muted)}
.cur{display:flex;gap:6px;margin-left:auto}
.cur div{
  display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:9px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);
}
.cur .g{color:var(--gold)} .cur .s{color:#8fd8ff}
.lobby-tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.lobby-tabs::-webkit-scrollbar{display:none}
.ltab{
  flex:0 0 auto;padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:800;color:#c3b0dd;
  background:rgba(255,255,255,.05);border:1px solid transparent;transition:.15s;display:flex;gap:5px;align-items:center;
}
.ltab.on{background:linear-gradient(180deg,#7a3fe0,#4a1f9e);color:#fff;border-color:#b18cff;box-shadow:0 4px 16px rgba(122,63,224,.4)}
.lobby-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 26px;-webkit-overflow-scrolling:touch}
.panel{background:linear-gradient(180deg,rgba(45,27,72,.85),rgba(24,14,40,.9));border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.panel h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.panel .hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 10px}

/* 스토리 */
.chapter-list{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;gap:10px;align-items:center;padding:10px;border-radius:13px;background:linear-gradient(90deg,rgba(66,38,104,.75),rgba(30,18,50,.7));border:1px solid var(--line)}
.chap.locked{opacity:.5}
.chap canvas{width:56px;height:44px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(255,255,255,.12);image-rendering:pixelated}
.chap .ci{flex:1;min-width:0}
.chap .ci b{font-size:14px;display:block}
.chap .ci span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.chap .prog{height:5px;border-radius:4px;background:rgba(0,0,0,.45);margin-top:5px;overflow:hidden}
.chap .prog i{display:block;height:100%;background:linear-gradient(90deg,#f6c453,#ff8a3d)}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
.stage{
  position:relative;aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3b2462,#221336);border:1px solid rgba(255,255,255,.1);font-weight:800;font-size:14px;cursor:pointer;
}
.stage small{font-size:8.5px;color:#b49fd0;font-weight:600}
.stage.lock{opacity:.35;pointer-events:none}
.stage.done{background:linear-gradient(180deg,#2f5a3f,#1b3a28);border-color:#4f9d6c}
.stage.done::after{content:"✔";position:absolute;top:2px;right:4px;font-size:9px;color:#7ff0a8}
.stage.elite{background:linear-gradient(180deg,#6a3aa0,#3b1f66);border-color:#b18cff}
.stage.boss{background:linear-gradient(180deg,#a02a3c,#5e1424);border-color:#ff8a98}
.stage.cur{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(246,196,83,.5)}
.stage-info{margin-top:12px;padding:12px;border-radius:14px;background:linear-gradient(180deg,rgba(58,34,92,.9),rgba(28,16,46,.95));border:1px solid var(--line2)}
.stage-info .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.stage-info .row b{font-size:16px}
.stage-info p{margin:4px 0 10px;font-size:12.5px;color:#d6c6ee;line-height:1.5}
.foe-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.foe-chip{font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:flex;gap:4px;align-items:center}
.foe-chip canvas{width:20px;height:20px;image-rendering:pixelated}

/* 아레나 */
.tier-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tier-row::-webkit-scrollbar{display:none}
.tier{flex:0 0 auto;padding:6px 11px;border-radius:9px;font-size:12px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tier.on{background:linear-gradient(180deg,#f6c453,#c98a1a);color:#2b1700;border-color:#ffe9a8}
.rival{display:flex;gap:10px;align-items:center;padding:10px;border-radius:13px;background:linear-gradient(90deg,rgba(66,38,104,.7),rgba(30,18,50,.7));border:1px solid var(--line);margin-bottom:8px}
.rival canvas{width:48px;height:48px;image-rendering:pixelated;background:#0c0616;border-radius:10px;border:1px solid var(--line)}
.rival .ri{flex:1;min-width:0}
.rival .ri b{font-size:14px}
.rival .ri span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

/* 카드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mini{
  position:relative;border-radius:10px;overflow:hidden;background:#150c24;border:1px solid var(--line);
  aspect-ratio:3/4;cursor:pointer;transition:transform .12s;
}
.mini:active{transform:scale(.97)}
.mini canvas{width:100%;height:100%;display:block}
.mini .lv{position:absolute;left:3px;top:3px;font-size:9px;font-weight:900;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:5px;border:1px solid rgba(255,255,255,.2)}
.mini .nm{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;padding:8px 3px 3px;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .dup{position:absolute;right:3px;top:3px;font-size:9px;background:rgba(246,196,83,.9);color:#3a2200;font-weight:900;padding:1px 4px;border-radius:5px}
.mini.deck{outline:2px solid var(--gold);outline-offset:-2px}
.rar-일반{border-color:#8c8c9c}.rar-희귀{border-color:#5ab8ff}.rar-영웅{border-color:#a86bff}
.rar-전설{border-color:#f6c453}.rar-신화{border-color:#ff6b9d;box-shadow:0 0 14px rgba(255,107,157,.5)}
.deck-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.deck-slots .slot{aspect-ratio:3/4;border-radius:9px;border:2px dashed rgba(255,255,255,.18);background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:10px;color:#7b689a;overflow:hidden;cursor:pointer;position:relative}
.deck-slots .slot canvas{width:100%;height:100%}
.gacha-banner{border-radius:16px;padding:14px;background:
  radial-gradient(120% 120% at 20% 0%,rgba(255,107,157,.45),transparent 55%),
  radial-gradient(120% 120% at 90% 20%,rgba(90,184,255,.4),transparent 55%),
  linear-gradient(180deg,#3a1f5e,#1a0f2c);border:1px solid var(--line2);text-align:center;margin-bottom:10px}
.gacha-banner h3{margin:0 0 4px;font-size:17px;color:var(--gold2)}
.gacha-banner p{margin:0 0 10px;font-size:12px;color:#d6c6ee}
.gacha-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rate{font-size:10.5px;color:#a08fbd;margin-top:8px;line-height:1.6}

/* ── 전투 화면 ───────────────────────── */
#scrBattle{background:#0b0614}
.b-top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(180deg,rgba(46,24,76,.96),rgba(20,11,36,.9));border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
.b-top .bt{flex:1;min-width:0}
.b-top b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-top span{font-size:10.5px;color:#b49fd0}
.icobtn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.icobtn:active{transform:scale(.94)}
.b-field{position:relative;flex:1;min-height:0;overflow:hidden;background:#173a1e;touch-action:manipulation}
.b-field canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.field-hud{position:absolute;inset:0;pointer-events:none}
.field-log{
  position:absolute;left:8px;top:8px;max-width:70%;font-size:11px;line-height:1.45;color:#fff;
  text-shadow:0 1px 2px #000,0 0 6px #000;display:flex;flex-direction:column;gap:1px;pointer-events:none;
}
.field-log div{opacity:0;animation:logIn .25s forwards}
@keyframes logIn{to{opacity:1}}
.b-hand{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px 6px 4px;background:linear-gradient(180deg,#20102f,#150a24);border-top:1px solid rgba(255,255,255,.08)}
.hcard{
  position:relative;border-radius:9px;overflow:hidden;background:#150c24;border:2px solid rgba(255,255,255,.12);
  aspect-ratio:3/4.15;cursor:pointer;transition:transform .1s,box-shadow .15s,filter .15s;touch-action:manipulation;
}
.hcard canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hcard .nm{position:absolute;left:0;right:0;bottom:0;padding:9px 2px 2px;font-size:8.5px;text-align:center;font-weight:800;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 30%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.hcard .cond{position:absolute;left:2px;top:2px;font-size:8.5px;font-weight:900;padding:1px 4px;border-radius:5px;
  background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.25);color:#fff}
.hcard .uses{position:absolute;right:2px;top:2px;font-size:8.5px;font-weight:900;padding:1px 3px;border-radius:5px;
  background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2);color:#ffe9a8}
.hcard .eff{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:8px;color:#ffe9a8;text-shadow:0 1px 2px #000}
.hcard.ready{box-shadow:0 0 0 1px rgba(246,196,83,.9),0 0 14px rgba(246,196,83,.6);border-color:var(--gold)}
.hcard.no{filter:grayscale(.72) brightness(.62)}
.hcard.up{animation:cardUp .18s}
@keyframes cardUp{from{transform:translateY(6px) scale(.96)}to{transform:none}}
.hcard.fire{animation:cardFire .32s}
@keyframes cardFire{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-2deg);box-shadow:0 0 26px #ffd873}100%{transform:scale(1)}}
.b-bottom{display:flex;align-items:center;gap:6px;padding:6px 8px 8px;background:linear-gradient(180deg,#1b0f2b,#100819);border-top:1px solid rgba(255,255,255,.07)}
.b-portrait{position:relative;width:54px;height:54px;flex:0 0 auto}
.b-portrait canvas{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3b2462,#150c24);border:2px solid rgba(246,196,83,.5)}
.b-portrait .ring{position:absolute;inset:-4px;transform:rotate(-90deg)}
.b-portrait .ring circle{fill:none;stroke-width:3.4;stroke-linecap:round}
.b-portrait .hpnum{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:9px;font-weight:900;color:#ffe9a8;text-shadow:0 1px 3px #000}
.b-gems{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;min-width:0}
.gem{
  position:relative;width:clamp(30px,8.4vw,44px);height:clamp(32px,9vw,46px);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .1s;flex:0 0 auto;
}
.gem svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.gem span{position:relative;font-weight:900;font-size:clamp(12px,3.4vw,16px);color:#1a1020;text-shadow:0 1px 0 rgba(255,255,255,.55);pointer-events:none}
.gem.sel{transform:translateY(-6px) scale(1.12)}
.gem.sel svg{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px #ffe9a8)}
.gem.used{opacity:.18;pointer-events:none;transform:scale(.8)}
.endturn{
  width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 32%,#ffe9a8,#f6c453 42%,#b9791c 100%);
  border:2px solid #fff2c9;box-shadow:0 3px 0 #6d4408,0 0 22px rgba(246,196,83,.5);
  color:#4a2c00;font-size:23px;font-weight:900;transition:transform .1s;
}
.endturn:active{transform:translateY(2px) scale(.96)}
.endturn.pulse{animation:etPulse 1.6s ease-in-out infinite}
@keyframes etPulse{0%,100%{box-shadow:0 3px 0 #6d4408,0 0 18px rgba(246,196,83,.45)}50%{box-shadow:0 3px 0 #6d4408,0 0 34px rgba(246,196,83,.95)}}

/* 튜토리얼 안내 */
.guide{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:92%;
  background:rgba(12,6,22,.94);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;
  font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.7);z-index:9;text-align:center;
  animation:guideIn .3s;pointer-events:none;
}
@keyframes guideIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.guide b{color:var(--gold)}
.guide .finger{display:inline-block;animation:pointBounce .9s ease-in-out infinite}
@keyframes pointBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tut-skip{position:absolute;right:8px;top:8px;z-index:10;font-size:11px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#d6c6ee}

/* ── 오버레이/모달 ───────────────────────── */
#ovl{position:absolute;inset:0;display:none;z-index:60;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,3,12,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#ovl.on{display:flex}
.modal{width:min(520px,94vw);max-height:88vh;overflow-y:auto;border-radius:18px;padding:16px;
  background:linear-gradient(180deg,#2d1a49,#180d2a);border:1px solid var(--line2);
  box-shadow:0 24px 60px rgba(0,0,0,.7);animation:modalIn .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 8px;font-size:17px;text-align:center}
.modal p{font-size:13px;color:#d6c6ee;line-height:1.6;margin:0 0 12px}
.modal .mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.modal .center{text-align:center}
.modal textarea{width:100%;height:80px;border-radius:10px;background:#100820;color:#cfe;border:1px solid var(--line);padding:8px;font-family:var(--mono);font-size:11px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);z-index:90;
  padding:9px 16px;border-radius:12px;background:rgba(20,10,34,.96);border:1px solid var(--line2);
  font-size:12.5px;font-weight:800;color:#ffe9a8;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 팩 개봉 / 가챠 연출 ─────────────────── */
.pack-stage{text-align:center;padding:6px 0}
.pack{width:130px;height:180px;margin:8px auto 14px;border-radius:12px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,#7a3fe0,#2b1258 60%,#12081f);border:2px solid #f6c453;
  box-shadow:0 0 30px rgba(246,196,83,.4),0 18px 30px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  animation:packFloat 2.4s ease-in-out infinite}
@keyframes packFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.pack.open{animation:packBurst .6s forwards}
@keyframes packBurst{60%{transform:scale(1.18);filter:brightness(2)}100%{transform:scale(1.6);opacity:0}}
.pack .seal{font-size:44px}
.pack .pname{position:absolute;bottom:10px;left:0;right:0;font-size:11px;font-weight:900;color:#ffe9a8;letter-spacing:2px}
.reveal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:10px 0}
.reveal{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:2px solid #555;
  animation:cardFlip .5s backwards;background:#0d0718}
@keyframes cardFlip{0%{transform:rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.reveal canvas{width:100%;height:100%;display:block}

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}

/* 문자열 아트: 각 문자=색 인덱스, '.'=투명 */
function parseArt(rows, palette){
  const h=rows.length, w=rows[0].length;
  const c=mk(w,h), g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x]; if(ch==='.')continue;
    g.fillStyle=palette[ch]||'#f0f'; g.fillRect(x,y,1,1);
  }
  return c;
}

/* ── 캐릭터 카드 일러스트 (30x40) ── */
function drawCardFigure(g, card, x, y, s){
  const P = card.c1, S = card.c2, D = card.c3;
  const px=(cx,cy,w,h,col)=>{g.fillStyle=col;g.fillRect(x+cx*s,y+cy*s,w*s,h*s);};
  // 배경: 밤하늘 그라디언트 + 별 + 마법진
  const bg=g.createLinearGradient(x,y,x,y+40*s);
  bg.addColorStop(0,'#0d0718'); bg.addColorStop(1,shade(card.c3,-38));
  g.fillStyle=bg; g.fillRect(x,y,30*s,40*s);
  g.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<9;i++){g.fillRect(x+((i*7+card.id.length*3)%29)*s,y+((i*11+5)%18)*s,s*.5,s*.5);}
  // 마법진
  g.strokeStyle=hexA(S,.5); g.lineWidth=Math.max(1,s*.5);
  g.beginPath(); g.ellipse(x+15*s,y+36*s,11*s,3.4*s,0,0,7); g.stroke();
  g.beginPath(); g.ellipse(x+15*s,y+36*s,7*s,2*s,0,0,7); g.stroke();
  // 뒤광
  g.fillStyle=hexA(card.c1,.28);
  g.beginPath(); g.arc(x+15*s,y+17*s,9.5*s,0,7); g.fill();
  // 망토
  if(card.cape){g.fillStyle=shade(P,-24);
    g.fillRect(x+7*s,y+15*s,16*s,17*s);
    g.fillRect(x+5*s,y+16*s,20*s,4*s);
    g.fillStyle=hexA(shade(P,-40),.7); g.fillRect(x+7*s,y+30*s,16*s,2*s);}
  // 몸통
  px(11,17,8,14,D); px(12,16,6,3,S);
  // 팔
  px(8,19,3,9,P); px(19,19,3,9,P);
  // 머리
  px(10,6,10,10,S);
  px(11,7,8,8,P);
  // 눈
  px(12,10,2,3,'#141020'); px(17,10,2,3,'#141020');
  px(12.6,10.6,.7,1.6,'#9ff'); px(17.6,10.6,.7,1.6,'#9ff');
  // 모자

function drawCard(canvas, card, back){
  const g=canvas.getContext('2d'); const W=canvas.width,H=canvas.height;
  g.imageSmoothingEnabled=false; g.clearRect(0,0,W,H);
  const r=card?RARITY[card.rare]:null;
  const col = back?'#4a3a6a':r.color;
  // 프레임
  g.fillStyle='#0d0718'; g.fillRect(0,0,W,H);
  const grad=g.createLinearGradient(0,0,0,H); grad.addColorStop(0,shade(col,30)); grad.addColorStop(1,shade(col,-30));
  g.strokeStyle=grad; g.lineWidth=5; g.strokeRect(3,3,W-6,H-6);
  if(!back){
    // 일러스트
    const s=Math.floor(W/34);
    drawCardFigure(g,card,0,0,s);
    // 하단 정보판
    g.fillStyle='rgba(8,4,16,.93)'; g.fillRect(4,H-46,W-8,42);
    g.fillStyle=grad; g.fillRect(4,H-46,W-8,2);
    g.fillStyle='#fff'; g.font='900 11px '+getComputedStyle(document.body).fontFamily;
    g.textAlign='center'; g.fillText(card.name, W/2, H-33, W-10);

    g.fillText(card.rare, W/2, H-23);
    g.fillStyle='#e8d8ff'; g.font='700 7px sans-serif';
    g.fillText(condLabel(card), W/2, H-14, W-8);
    g.fillStyle='#ffe9a8';
    g.fillText('x'+(card.uses||1), W/2, H-6);
    // 상단 좌측 조건 배지
    g.fillStyle='rgba(0,0,0,.78)'; g.fillRect(7,7,34,13);

    }

    if(card.rare==='신화'){
      const t=Date.now()*.003;
      g.strokeStyle=hexA('#ff6b9d',.4+.2*Math.sin(t)); g.lineWidth=2;
      g.strokeRect(6,6,W-12,H-12);
    }
  } else {
    // 카드 뒷면
    g.fillStyle='#1b0f2e'; g.fillRect(0,0,W,H);
    g.strokeStyle='#f6c453'; g.lineWidth=2; g.strokeRect(6,6,W-12,H-12);
    g.save(); g.translate(W/2,H/2);
    g.fillStyle='#f6c453'; g.font='900 30px serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('🃏',0,2);
    g.restore();
    g.fillStyle='#8a6aa8'; g.font='800 8px sans-serif'; g.textAlign='center';
    g.fillText('무한의 군주', W/2, H-14);
  }
}

/* ── 전투 필드 그리기 ── */
function drawField(cvs, theme, t){
  const g=cvs.getContext('2d');
  const W=cvs.width,H=cvs.height;
  const T=THEME_ART[theme]||THEME_ART.grass;
  // 하늘
  const sky=g.createLinearGradient(0,0,0,H*.5);
  sky.addColorStop(0,T.sky1); sky.addColorStop(1,T.sky2);
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // 별 (밤 테마)
  if(T.stars){g.fillStyle='rgba(255,255,255,.8)';
    for(let i=0;i<26;i++){const sx=(i*97)%W,sy=(i*53)%(H*.4);g.globalAlpha=.3+.5*Math.abs(Math.sin(t*.001+i));g.fillRect(sx,sy,2,2);}g.globalAlpha=1;}
  // 해/달
  g.fillStyle=T.orb; g.beginPath(); g.arc(W*.82,H*.16,H*.07,0,7); g.fill();
  g.fillStyle=hexA(T.orb,.3); g.beginPath(); g.arc(W*.82,H*.16,H*.11,0,7); g.fill();
  // 원경 산
  g.fillStyle=T.mtn;
  for(let i=0;i<5;i++){const bx=W*(i/4.5)-W*.06;g.beginPath();g.moveTo(bx,H*.5);g.lineTo(bx+W*.16,H*.26+(i%2)*H*.05);g.lineTo(bx+W*.32,H*.5);g.fill();}
  // 중경 언덕
  g.fillStyle=T.hill;
  g.beginPath();g.moveTo(0,H*.62);g.quadraticCurveTo(W*.3,H*.5,W*.6,H*.6);g.quadraticCurveTo(W*.85,H*.68,W,H*.56);g.lineTo(W,H);g.lineTo(0,H);g.fill();
  // 지면
  g.fillStyle=T.ground; g.fillRect(0,H*.6,W,H*.4);
  g.fillStyle=T.ground2; g.fillRect(0,H*.6,W,H*.035);
  // 지형 소품 (타일 기반)
  const tile=H/9;
  for(let i=0;i<14;i++){
    const dx=((i*173+theme.length*57)%W), dy=H*.66+((i*97)%(H*.3));
    const k=T.props[i%T.props.length];
    g.save(); g.translate(dx,dy); g.scale(tile/14,tile/14);
    g.globalAlpha=.9; g.fillStyle=k.c;
    g.fillRect(-k.w/2,-k.h,k.w,k.h);
    if(k.r){g.fillStyle=shade(k.c,22);g.fillRect(-k.w/2,-k.h,k.w,k.h*.3);}
    g.restore();
  }
  // 안개
  g.fillStyle=hexA(T.fog,.16);
  g.fillRect(0,H*.55,W,H*.2);
  // 비네트
  const vg=g.createRadialGradient(W/2,H*.5,H*.35,W/2,H*.5,H*.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.42)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

/* ── Web Audio 칩튠 ── */
const SFX=(()=>{
  let ctx=null, muted=false;
  const ac=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ctx;};
  function tone(freq,dur,type,vol,slide){
    if(muted)return; const a=ac(); if(!a)return;
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,a.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }
  function noise(dur,vol,hp){
    if(muted)return; const a=ac(); if(!a)return;
    const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=buf;
    const f=a.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp?2200:900;
    const g=a.createGain(); g.gain.value=vol||.15;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }
  return {
    unlock:()=>{const a=ac(); if(a&&a.state==='suspended')a.resume();},
    setMute:m=>muted=m, isMuted:()=>muted,
    click:()=>tone(660,.05,'square',.06),
    sel:()=>{tone(520,.07,'square',.08);setTimeout(()=>tone(780,.09,'square',.08),60);},
    gem:()=>tone(840,.06,'triangle',.1),
    hit:()=>{noise(.12,.2,1);tone(180,.1,'sawtooth',.12,-100);},
    pierce:()=>{noise(.16,.22,1);tone(120,.14,'sawtooth',.14,-60);},
    block:()=>{tone(240,.12,'square',.12);setTimeout(()=>tone(320,.1,'square',.1),70);},
    heal:()=>{tone(520,.1,'sine',.12);setTimeout(()=>tone(660,.1,'sine',.12),90);setTimeout(()=>tone(880,.14,'sine',.12),180);},
    poison:()=>tone(140,.25,'sawtooth',.08,-60),
    buff:()=>{tone(440,.08,'square',.1);setTimeout(()=>tone(560,.08,'square',.1),70);setTimeout(()=>tone(700,.1,'square',.1),140);},
    draw:()=>tone(980,.05,'triangle',.07,180),
    win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'square',.11),i*130));},
    lose:()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sawtooth',.1),i*160));},
    rare:(n)=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,.12,'sine',.13),i*90));if(n>=3)setTimeout(()=>{[1046,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.13),i*110));},420);},
    gold:()=>{[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.14,'square',.1),i*100));},
    stun:()=>{tone(880,.08,'square',.09);setTimeout(()=>tone(440,.14,'square',.09),80);},
    pack:()=>{noise(.3,.12,0);tone(220,.3,'sine',.1,300);},
    turn:()=>{tone(320,.08,'triangle',.1);setTimeout(()=>tone(480,.1,'triangle',.1),80);}
  };
})();

function gemVal(i){return B.gems[i]?B.gems[i].v:0;}
function condMatch(card, idxs){
  const need=condNeed(card);
  if(idxs.length<need)return false;
  const vals=idxs.map(i=>B.gems[i].v), suits=idxs.map(i=>B.gems[i].suit);
  switch(card.cond){
    case 'any':return true;
    case 'even':return vals.every(v=>v%2===0);
    case 'odd':return vals.every(v=>v%2===1);
    case 'le4':return vals.every(v=>v<=4);
    case 'le8':return vals.every(v=>v<=8);
    case 'le12':return vals.every(v=>v<=12);
    case 'ge8':return vals.every(v=>v>=8);
    case 'ge12':return vals.every(v=>v>=12);
    case 'tri':case 'dia':case 'hex':case 'cir':return suits.every(s=>s===card.cond);
    case 'pair':return vals.reduce((a,b)=>a+b,0)>=15;
    case 'pairsq':return vals[0]===vals[1];
    case 'pairsuit':return suits[0]===suits[1];
  }
  return false;
}
/* 조건에 맞는 젬 조합 찾기 */
function findMatch(card){
  const need=condNeed(card), n=B.gems.length;
  const idxs=[];
  for(let m=0;m<(1<<n);m++){
    idxs.length=0;
    for(let i=0;i<n;i++)if(m&(1<<i))idxs.push(i);
    if(idxs.length===need&&idxs.every(i=>!B.usedGems[i])&&condMatch(card,idxs))return idxs;
  }
  return null;
}
function cardsReady(){
  return B.hand.filter(id=>{
    const c=CARD_BY[id]; if(!c)return false;
    const used=B.cardsUsedThisTurn[id]||0;
    return used<(c.uses||1) && !!findMatch(c);
  });
}
function useCardAt(i){
  const id=B.hand[i]; if(!id)return;
  const c=CARD_BY[id];
  const used=B.cardsUsedThisTurn[id]||0;
  if(used>=(c.uses||1)){toast('이번 턴에 사용 횟수를 다 썼어');return;}
  const idxs=findMatch(c);
  if(!idxs){toast('조건 젬이 없어: '+condLabel(c));SFX.click();return;}
  // 사용
  idxs.sort((a,b)=>b-a).forEach(k=>{B.usedGems[k]=true;B.gems[k]={v:0,suit:B.gems[k].suit,used:true};});
  B.cardsUsedThisTurn[id]=(used||0)+1;
  B.hand.splice(i,1);
  B.pile.push(id);
  SFX.gem();
  resolveCard(cardPower(c));
  renderGems(); renderHand(); updateHud();
  if(typeof TUT!=='undefined'&&TUT.active&&TUT.steps[TUT.step]&&TUT.steps[TUT.step].c==='card')tutNext();
  if(B.phase!=='play')return;
  if(!B.hand.length||B.gems.every(g=>g.used)) setTimeout(()=>{if(B&&B.phase==='play')endTurn();},B.speed*520);
}
function aliveFoes(){return B.foes.filter(f=>f.hp>0);}
function dealDmg(foe,amount,opts){
  opts=opts||{};
  let d=amount+B.player.atkBuff;
  if(!opts.pierce&&foe.block>0){const ab=Math.min(foe.block,d);foe.block-=ab;d-=ab;}
  foe.hp=Math.max(0,foe.hp-d);
  addFx({t:'dmg',x:foe.fx, y:foe.fy, v:d, pierce:opts.pierce});
  B.shake=Math.min(10,2+d*.3); B.flash=opts.pierce?.5:.25;
  if(opts.pierce)SFX.pierce(); else SFX.hit();
  if(foe.hp<=0){addFx({t:'die',x:foe.fx,y:foe.fy});}
}
function addFx(f){B.fx.push(Object.assign({t0:performance.now()},f));}
function logMsg(s){

  const el=$('fieldLog'); el.innerHTML=B.log.map(l=>'<div>'+esc(l)+'</div>').join('');

function resolveCard(c){
  const foes=aliveFoes();
  logMsg('▶ '+c.name);
  const addFxCard=()=>{};
  switch(c.eff){
    case 'dmg':{const t=foes[0];if(t)dealDmg(t,c.val);break;}
    case 'pierce':{const t=foes[0];if(t)dealDmg(t,c.val,{pierce:1});break;}
    case 'multi':{for(let k=0;k<(c.val>=7?3:2);k++){const t=aliveFoes()[0];if(t)dealDmg(t,c.val);}break;}
    case 'all':{aliveFoes().forEach(t=>dealDmg(t,c.val));break;}
    case 'block':{B.player.block+=c.val;SFX.block();addFx({t:'block',v:c.val});logMsg('방어 '+c.val+' 획득');break;}
    case 'guard':{B.player.block+=c.val;B.player.hp=Math.min(B.player.maxhp,B.player.hp+Math.round(c.val*.5));SFX.heal();addFx({t:'heal',v:Math.round(c.val*.5)});logMsg('방어 '+c.val+' + 회복 '+Math.round(c.val*.5));break;}
    case 'heal':{B.player.hp=Math.min(B.player.maxhp,B.player.hp+c.val);SFX.heal();addFx({t:'heal',v:c.val});logMsg('체력 '+c.val+' 회복');break;}
    case 'drain':{const t=foes[0];if(t){dealDmg(t,c.val);B.player.hp=Math.min(B.player.maxhp,B.player.hp+c.val);addFx({t:'heal',v:c.val});}break;}
    case 'poison':{const t=foes[0];if(t){t.pois=(t.pois||0)+c.val;t.poisT=3;SFX.poison();logMsg(t.name+' 독 '+c.val+' (3턴)');addFx({t:'poison',x:t.fx,y:t.fy});}break;}
    case 'stun':{const t=foes[0];if(t){dealDmg(t,c.val);if(t.hp>0){t.teleNow=(t.teleNow||0)+1;SFX.stun();logMsg(t.name+' 행동 지연');}}break;}
    case 'buff':{B.player.atkBuff+=c.val;SFX.buff();addFx({t:'buff',v:c.val});logMsg('공격력 +'+c.val+' (전투 내 유지)');break;}
    case 'reroll':{
      const n=c.val;
      let cnt=0;
      for(let i=0;i<B.gems.length&&cnt<n;i++){if(B.usedGems[i]){B.gems[i]=makeGems(1)[0];B.usedGems[i]=false;cnt++;}}
      logMsg('젬 '+cnt+'장 리롤'); SFX.draw(); break;
    }
    case 'gold':{const t=foes[0];if(t)dealDmg(t,2);S.gold+=c.val;updateCur();SFX.gold();logMsg('🪙 '+c.val+' 획득');break;}
    case 'genesis':{const t=foes[0];if(t)dealDmg(t,c.val);if(B.deck.length||B.pile.length){if(!B.deck.length){B.deck=shuffle(B.pile);B.pile=[];}B.hand.push(B.deck.pop());SFX.draw();logMsg('카드 1장 드로우');}break;}
  }
}
function endTurn(){
  if(B.phase!=='play')return;
  B.phase='enemy';
  // 독 틱
  aliveFoes().forEach(f=>{
    if(f.pois>0&&f.poisT>0){f.hp=Math.max(0,f.hp-f.pois);f.poisT--;addFx({t:'poison',x:f.fx,y:f.fy,v:f.pois});logMsg(f.name+' 독 '+f.pois+' 피해');}
  });
  if(!aliveFoes().length){setTimeout(()=>{if(B&&B.phase!=='end')win();},B.speed*450);return;}
  setTimeout(()=>{if(B&&B.phase==='enemy')enemyAct();},B.speed*420);
}
function enemyAct(){
  if(!B||B.phase!=='enemy')return;
  const foes=aliveFoes();
  if(!foes.length){win();return;}
  const f=foes[0];
  const d=FOE_DATA[f.kind];
  // 아레나: 라이벌이 카드를 쓰는 연출
  if(B.arena&&B.cfg.rivalDeck){
    const cid=pick(B.cfg.rivalDeck);
    logMsg(B.cfg.title.split('· ')[1]||'라이벌');
    logMsg('「'+CARD_BY[cid].name+'」발동!');
  }
  // 예고 표시 중이던 행동 발동
  const act=f.pendingAct||'dmg';
  f.pendingAct=null;
  let dmgTaken=0;
  if(act==='dmg'){
    let d2=f.atk;
    if(B.player.block>0){const ab=Math.min(B.player.block,d2);B.player.block-=ab;d2-=ab;}
    B.player.hp=Math.max(0,B.player.hp-d2);
    dmgTaken=d2;
    B.shake=6;B.flash=.3;
    addFx({t:'pdmg',v:d2});
    SFX.hit();
    logMsg(f.name+' 공격! '+d2+' 피해');
  } else if(act==='dmgall'){
    let d2=Math.round(f.atk*.7);
    if(B.player.block>0){const ab=Math.min(B.player.block,d2);B.player.block-=ab;d2-=ab;}
    B.player.hp=Math.max(0,B.player.hp-d2);
    B.shake=8;B.flash=.4;addFx({t:'pdmg',v:d2});SFX.hit();
    logMsg(f.name+' 전체 공격! '+d2+' 피해');
  } else if(act==='block'){
    f.block+=Math.round(f.atk*.8);logMsg(f.name+' 방어 '+Math.round(f.atk*.8));SFX.block();
  } else if(act==='poison'){
    B.player.pois=(B.player.pois||0)+Math.max(2,Math.round(f.atk*.3));
    B.player.poisT=3;SFX.poison();
    logMsg(f.name+' 독 부여! ('+Math.max(2,Math.round(f.atk*.3))+')');
  }
  B.phase='play';
  updateHud();
  if(B.player.hp<=0){lose();return;}
  if(!aliveFoes().length){setTimeout(()=>{if(B)win();},B.speed*400);return;}
  // 다음 예고
  const next=aliveFoes()[0];
  if(next){next.pendingAct=next.act; next.actT=rnd(3);}
  startTurn();
}
function win(){
  if(!B||B.phase==='end')return;
  B.phase='end'; SFX.win();
  const cfg=B.cfg;
  if(cfg.tut){
    setTimeout(()=>{const b=B;B=null;stopBattleLoop();giveStarterPack();},B.speed*700);
    return;
  }
  let gold=Math.round(cfg.gold||40), shards=Math.round(cfg.shards||2);
  if(cfg.arena){S.arenaPts+=cfg.pts||20;S.arenaWins++;S.arenaTier=S.arenaTier||0;}
  S.gold+=gold; S.shard+=shards; S.wins++;
  save();
  const got=[];
  if(!cfg.arena){
    // 스테이지 클리어 표시 & 보상
    markStageClear(cfg.ch, cfg.st);
    if((cfg.st)%10===0){ // 보스/정예 보너스 카드
      const id=rewardCard(2);
      got.push(id);
    }
  }
  showWinModal(gold,shards,got,cfg);
}
function lose(){
  if(!B||B.phase==='end')return;

  const tut=!!B.cfg.tut, cfgT=B.cfg.title;
  if(B.cfg.arena){S.arenaLoses++;S.arenaPts=Math.max(0,S.arenaPts-(B.cfg.pts||20)/2|0);}

  setTimeout(()=>{
    if(tut){
      modal('<h2>💀 패배…</h2><p class="center">괜찮아, 다시 한 번!<br>카드 조건(배지)과 젬 색·숫자를 확인하자.</p>'+
        '<div class="mbtns"><button class="btn primary" id="rTut">다시 도전</button><button class="btn ghost" id="rSkip">스타터팩 받기</button></div>',{lock:1});
      $('rTut').onclick=()=>{closeModal();B=null;stopBattleLoop();startTutorial();};

    modal('<h2>💀 패배</h2><p class="center">'+esc(cfgT)+' — 카드의 힘이 약했다.<br>카드를 뽑고 덱을 다듬고 다시 도전하자.</p>'+
      '<div class="mbtns"><button class="btn primary" data-close>로비로</button></div>',{});
  },600);
}

  }

}
function rewardCard(minOrder){

function renderGems(){
  const el=$('gemsEl');
  el.innerHTML=B.gems.map((g,i)=>{
    const cls='gem'+(B.sel.includes(i)?' sel':'')+(g.used?' used':'');

  }).join('');

    e.onclick=()=>{

      const i=+e.dataset.i;

      // 자동 매칭: 조건이 맞는 카드 찾아 강조
      renderHand();
      renderGems();
      if(typeof TUT!=='undefined'&&TUT.active){const st=TUT.steps[TUT.step]; if(st&&(!st.c||st.c==='gem'))tutNext();}

function renderHand(){
  const el=$('handEl');
  const selN=B.sel.length;
  const readySet={}; cardsReady().forEach(id=>readySet[id]=1);
  el.innerHTML=B.hand.map((id,i)=>{
    const c=CARD_BY[id]; if(!c)return'';
    const cp=cardPower(c);
    const used=(B.cardsUsedThisTurn[id]||0);

    return '<div class="hcard'+(isReady?' ready':' no')+'" data-i="'+i+'" style="animation:cardUp .18s '+i*.04+'s backwards">'+
      '<canvas width="90" height="124"></canvas>'+
      '<div class="cond">'+condLabel(c)+'</div>'+
      '<div class="uses">'+(used<(c.uses||1)?'x'+((c.uses||1)-used):'소진')+'</div>'+
      '<div class="eff">'+esc(effTxt)+'</div>'+
      '<div class="nm">'+esc(c.name)+'</div></div>';
  }).join('');
  el.querySelectorAll('.hcard').forEach(e=>{
    const i=+e.dataset.i, c=CARD_BY[B.hand[i]];

      if(B.phase!=='play')return;

function effShort(c){
  switch(c.eff){
    case 'dmg':return '단일 '+c.val;
    case 'pierce':return '무시 '+c.val;
    case 'multi':return c.val+'×'+(c.val>=7?3:2);
    case 'all':return '전체 '+c.val;
    case 'block':return '방어 '+c.val;
    case 'guard':return '방어 '+c.val+'+회복';
    case 'heal':return '회복 '+c.val;
    case 'drain':return c.val+' 흡수';
    case 'poison':return '독 '+c.val;
    case 'stun':return c.val+'+지연';
    case 'buff':return '공격 +'+c.val;
    case 'reroll':return '리롤 '+c.val;
    case 'gold':return '🪙'+c.val;
    case 'genesis':return c.val+'+드로우';
  }
  return '';
}
function updateHud(){

}

/* ── 전투 필드 렌더 ── */
function layoutFoes(){
  const W=$('field').width,H=$('field').height;
  const fs=aliveFoes();
  const n=fs.length;
  fs.forEach((f,i)=>{
    const spread=Math.min(W*.7, n*W*.24);
    const x=W*.5+(n===1?0:(i-(n-1)/2)*(spread/Math.max(1,n-1)));
    f.fx=x-26; f.fy=H*.42-30+((i%2)*H*.06);
  });
}
function drawBattle(t){
  const cvs=$('field');
  if(!B)return;
  const W=cvs.width,H=cvs.height,g=cvs.getContext('2d');
  g.imageSmoothingEnabled=false;
  let shx=0,shy=0;
  if(B.shake>0){shx=(Math.random()-.5)*B.shake;shy=(Math.random()-.5)*B.shake;B.shake*=.86;if(B.shake<.4)B.shake=0;}
  g.save(); g.translate(shx,shy);
  drawField(cvs,B.cfg.theme,t);
  // 인트로 암전
  if(B.intro>0){B.intro-=.016*B.speed;}
  // 내 캐릭터
  const me=CARD_BY[S.starter];
  const mx=W*.14, my=H*.5;
  const bob=Math.sin(t*.002)*3;
  g.save(); g.translate(mx,my+bob);
  g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0,66,26,7,0,0,7); g.fill();
  g.drawImage(portraitBig(me),-32,-10,64,80);
  g.restore();
  // 내 방어막
  if(B.player.block>0){
    g.strokeStyle=hexA('#7fd4ff',.85); g.lineWidth=3;
    g.beginPath(); g.arc(mx,my+28,42+Math.sin(t*.004)*2,0,7); g.stroke();
    g.fillStyle='#7fd4ff'; g.font='900 12px sans-serif'; g.textAlign='center';
    g.fillText('🛡'+B.player.block, mx, my-18);
  }
  if(B.player.atkBuff>0){
    g.fillStyle='#ffb85a'; g.font='900 12px sans-serif'; g.textAlign='center';
    g.fillText('⚔+'+B.player.atkBuff, mx+34, my-10);
  }
  // 몬스터
  layoutFoes();
  B.foes.forEach((f,i)=>{
    if(f.hp<=0){
      // 사라짐 애니: 페이드
      return;
    }
    const bob=Math.sin(t*.0023+i*2)*3;
    const x=f.fx,y=f.fy+bob;
    g.save();
    g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x+26,y+62,24,6,0,0,7); g.fill();
    g.drawImage(f.sprite,x,y,52,52);
    // 예고 상태
    if(f.pendingAct){
      const isAtk=['dmg','dmgall'].includes(f.pendingAct);
      const bw=56,bh=15;
      g.fillStyle='rgba(8,4,16,.85)'; g.fillRect(x-4,y-20,bw,bh);
      g.strokeStyle=isAtk?hexA('#ff5a6e',.9):hexA('#7fd4ff',.9); g.lineWidth=1.5; g.strokeRect(x-4,y-20,bw,bh);
      g.fillStyle=isAtk?'#ff8a9a':'#7fd4ff'; g.font='800 9.5px sans-serif'; g.textAlign='center';
      g.fillText((isAtk?'⚔':'🛡')+' '+actLabel(f.pendingAct), x+24, y-9);
    }
    // HP 게이지
    const gw=52;
    g.fillStyle='rgba(0,0,0,.72)'; g.fillRect(x,y-9,gw,6);
    const hpw=Math.max(0,gw*f.hp/f.maxhp);
    g.fillStyle=f.boss?'#ff8a3d':'#5ce08a'; g.fillRect(x,y-9,hpw,6);
    g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=1; g.strokeRect(x,y-9,gw,6);
    // 독
    if(f.pois>0&&f.poisT>0){g.fillStyle='#8ad86a';g.font='900 10px sans-serif';g.textAlign='center';g.fillText('☠'+f.pois,x+26,y+70);}
    if(f.block>0){g.fillStyle='#7fd4ff';g.font='900 10px sans-serif';g.textAlign='center';g.fillText('🛡'+f.block,x+26,y-13);}
    g.restore();
  });
  // 독 틱 등 대기중 표시
  // 이펙트
  const now=performance.now();
  B.fx=B.fx.filter(f=>now-f.t0<800);
  B.fx.forEach(f=>{
    const p=(now-f.t0)/800;
    g.save();
    if(f.t==='dmg'||f.t==='pdmg'){
      const yy=(f.y||H*.4)-p*34;
      g.globalAlpha=1-p;
      g.font='900 '+(16+Math.min(10,f.v*.4))+'px sans-serif'; g.textAlign='center';
      g.strokeStyle='#000'; g.lineWidth=3;
      g.strokeText('-'+f.v, f.x||W*.2, yy); g.fillStyle='#ff5a6e'; g.fillText('-'+f.v, f.x||W*.2, yy);
    } else if(f.t==='heal'){
      g.globalAlpha=1-p; g.font='900 15px sans-serif'; g.textAlign='center';
      g.strokeStyle='#000';g.lineWidth=3;g.strokeText('+'+f.v, W*.2, H*.42-p*30);
      g.fillStyle='#5ce08a'; g.fillText('+'+f.v, W*.2, H*.42-p*30);
    } else if(f.t==='die'){
      g.globalAlpha=(1-p)*.9; g.fillStyle='#fff';
      g.beginPath(); g.arc(f.x+26,f.y+26,p*46,0,7); g.fill();
    } else if(f.t==='poison'){
      g.globalAlpha=1-p; g.fillStyle='#8ad86a'; g.font='900 13px sans-serif'; g.textAlign='center';
      g.strokeText&&(()=>{})();
      g.strokeStyle='#000';g.lineWidth=3;g.strokeText('☠'+(f.v||''),f.x+26,f.y-p*20);g.fillText('☠'+(f.v||''),f.x+26,f.y-p*20);
    } else if(f.t==='block'){
      g.globalAlpha=1-p; g.fillStyle='#7fd4ff'; g.font='900 14px sans-serif'; g.textAlign='center';
      g.strokeStyle='#000';g.lineWidth=3;g.strokeText('🛡'+f.v,W*.2,H*.38-p*24);g.fillText('🛡'+f.v,W*.2,H*.38-p*24);
    } else if(f.t==='buff'){
      g.globalAlpha=1-p; g.fillStyle='#ffb85a'; g.font='900 14px sans-serif'; g.textAlign='center';
      g.strokeStyle='#000';g.lineWidth=3;g.strokeText('⚔+'+f.v,W*.2,H*.34-p*24);g.fillText('⚔+'+f.v,W*.2,H*.34-p*24);
    }
    g.restore();
  });
  // 플래시
  if(B.flash>0){g.fillStyle=hexA('#ff5a6e',B.flash*.35);g.fillRect(0,0,W,H);B.flash-=.02*B.speed;}
  if(B.intro>0){g.fillStyle='rgba(0,0,0,'+(B.intro/1.2)+')';g.fillRect(0,0,W,H);}
  g.restore();
  // 튜토리얼 하이라이트
  if(TUT.active)TUT.frame();
}
function actLabel(a){
  return a==='dmg'?'공격':a==='dmgall'?'전체공격':a==='block'?'방어':a==='poison'?'독':'공격';
}

function type3(s){return s===30?'BOSS':s%10===0?'ELITE':'일반';}
function stageName(c,s){const ch=CHAPTERS[c];return s===30?ch.boss:(s%10===0?'정예 소탕':(s%2?'이동과 조우':'카드 추적'));}
function stageFoes(c,s){
  const ch=CHAPTERS[c];
  const pool=ch.foes;
  const boost=1+c*.28+s*.02;
  if(s===30)return [{kind:c===29?'lord':pool[pool.length-1],hp:Math.round((c===29?900:60+c*26)*boost),boss:1},{kind:pool[0],hp:Math.round(30*boost)},{kind:pool[1],hp:Math.round(30*boost)}];
  if(s%10===0)return [{kind:pool[pool.length-1],hp:Math.round((42+c*18)*boost),elite:1},{kind:pool[1],hp:Math.round(24*boost)}];
  const n=1+(s%3===0?1:0)+(s%7===0?1:0);
  return Array.from({length:Math.min(3,n)},()=>({kind:pick(pool),hp:Math.round((26+c*14)*boost)}));
}
function stageStory(c,s){
  const ch=CHAPTERS[c];
  if(s===30)return ch.st[1]+' — 챕터의 보스가 카드를 지킨다.';
  if(s%10===0)return ch.st[0]+' 정예가 길을 막는다.';
  return ch.st[0];
}

  const ch=CHAPTERS[c];

    title:(c+1)+'-'+s+' '+ch.n, chLabel:(c+1)+'-'+s, theme:ch.th,
    foes, baseHp:24*boost, baseAtk:4+c*.75+ (s>=30?2:s>=20?1.2:s>=10?.6:0),
    gold:Math.round((22+c*10)*(s%10===0?1.8:s===30?2.6:1)),
    shards:Math.round(2+c*.4)*(s===30?3:s%10===0?2:1),
    ch:c, st:s, after:'lobbyStages'
  });

/* ── 가챠 탭 ── */
function rollRarity(){
  const r=Math.random()*100;
  let acc=0;
  const order=['신화','전설','영웅','희귀','일반'];
  const rates=[RARITY['신화'].rate,RARITY['전설'].rate,RARITY['영웅'].rate,RARITY['희귀'].rate,100];
  // 신화→일반 누적
  let cum=0;
  for(const k of order){cum+=RARITY[k].rate;if(r<cum)return k;}
  return '일반';
}
function rollCard(){
  const rare=rollRarity();
  const pool=CARDS.filter(c=>c.rare===rare&&c.id!=='m_genesis');
  return pick(pool.length?pool:CARDS.filter(c=>c.rare==='일반')).id;
}

      SFX.click();
      if(S.deck.includes(id)){S.deck=S.deck.filter(x=>x!==id);}
      else{if(S.deck.length>=6){toast('덱이 가득 찼어 (6장)');return;}S.deck.push(id);}
      save();renderDeck();
    };
    el.oncontextmenu=e=>{e.preventDefault();showCardDetail(el.dataset.id);};
  });
}
function showCardDetail(id){
  const c=CARD_BY[id], cp=cardPower(c);
  const m=modal('<h2>'+esc(c.name)+' <span style="font-size:12px;color:'+RARITY[c.rare].color+'">'+c.rare+' · Lv.'+cardLv(id)+'</span></h2>'+
    '<div class="center"><canvas id="dcard" width="128" height="170" style="max-width:200px;width:60%;border-radius:12px"></canvas></div>'+
    '<p class="center">'+esc(c.desc)+(cardLv(id)>1?' <b style="color:var(--gold)">(레벨 '+cardLv(id)+': 수치 +'+Math.round((cardLv(id)-1)*12)+'%)</b>':'')+'</p>'+
    '<p class="center hint">조건: '+condLabel(c)+' · 턴당 x'+c.uses+'</p>'+
    '<div class="mbtns" id="fuseRow"></div><div class="mbtns"><button class="btn ghost sm" data-close>닫기</button></div>');
  drawCard(m.querySelector('#dcard'),cp);
  const fuseRow=m.querySelector('#fuseRow');
  if((S.cards[id]||0)>=2){
    const b=document.createElement('button');
    b.className='btn gold sm'; b.textContent='🔄 합성 강화 (중복 '+S.cards[id]+'장 → Lv.'+(cardLv(id)+1)+')';
    b.onclick=()=>{
      S.cards[id]-=2; if(S.cards[id]<=0)delete S.cards[id];
      S.lv[id]=cardLv(id)+1;
      save();SFX.buff();toast(c.name+' → Lv.'+S.lv[id]);
      closeModal();renderDeck();
    };
    fuseRow.appendChild(b);
  }
}

/* ── 보유 카드 ── */
function renderCards(){
  const body=$('lobbyBody');
  const own=ownList().map(id=>CARD_BY[id]).filter(Boolean).sort((a,b)=>RARITY[b.rare].order-RARITY[a.rare].order||a.name.localeCompare(b.name));
  body.innerHTML='<div class="panel"><h2>📚 보유 카드 '+own.length+'종</h2><p class="hint">카드를 누르면 상세·합성 강화. (꾹 누르거나 길게=상세)</p><div class="card-grid">'+
    own.map(c=>'<div class="mini rar-'+c.rare+'" data-id="'+c.id+'"><canvas width="92" height="122"></canvas><div class="lv">Lv.'+cardLv(c.id)+'</div>'+(S.cards[c.id]>1?'<div class="dup">x'+S.cards[c.id]+'</div>':'')+'<div class="nm">'+esc(c.name)+'</div></div>').join('')+
    '</div></div>';
  body.querySelectorAll('.mini canvas').forEach(cv=>drawCard(cv,cardPower(CARD_BY[cv.parentElement.dataset.id])));
  body.querySelectorAll('.mini').forEach(el=>el.onclick=()=>showCardDetail(el.dataset.id));
}

/* ── 도감 ── */
function renderDex(){
  const body=$('lobbyBody');
  const got=CARDS.filter(c=>S.dex[c.id]||S.cards[c.id]);
  body.innerHTML='<div class="panel"><h2>📖 카드 도감 '+got.length+'/'+CARDS.length+'</h2><div class="card-grid">'+
    CARDS.map(c=>{
      const has=!!(S.dex[c.id]||S.cards[c.id]);
      return '<div class="mini" data-id="'+c.id+'" style="'+(has?'':'filter:brightness(0) grayscale(1)')+'"><canvas width="92" height="122"></canvas><div class="nm">'+(has?esc(c.name):'???')+'</div></div>';
    }).join('')+'</div></div>';
  body.querySelectorAll('.mini canvas').forEach(cv=>{
    const c=CARD_BY[cv.parentElement.dataset.id];
    if(S.dex[c.id]||S.cards[c.id])drawCard(cv,c); else drawCard(cv,null,true);
  });
  body.querySelectorAll('.mini').forEach(el=>el.onclick=()=>{
    const c=CARD_BY[el.dataset.id];
    if(S.dex[c.id]||S.cards[c.id])showCardDetail(c.id);
  });
}

/* ── 설정 ── */
function renderEtc(){
  const body=$('lobbyBody');
  body.innerHTML='<div class="panel"><h2>⚙️ 설정</h2>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn ghost" id="eBackup">💾 세이브 백업 코드 복사</button>'+
    '<button class="btn ghost" id="eRestore">📥 세이브 복원</button>'+
    '<button class="btn danger" id="eReset">🗑️ 세이브 초기화</button>'+
    '<button class="btn ghost" id="eMuteToggle">'+(SFX.isMuted()?'🔇 소리 켜기':'🔊 소리 끄기')+'</button>'+
    '</div>'+
    '<p class="hint" style="margin-top:10px">진행도: '+S.wins+'승 · 카드 '+ownList().length+'종 보유 · 아레나 '+S.arenaPts+'pt</p></div>';
  $('eBackup').onclick=()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    modal('<h2>💾 세이브 백업</h2><p>아래 코드를 복사해 보관해라.</p><textarea readonly>'+code+'</textarea><div class="mbtns"><button class="btn primary" data-close>닫기</button></div>');
  };
  $('eRestore').onclick=()=>{
    const m=modal('<h2>📥 세이브 복원</h2><p>백업 코드를 붙여넣어라.</p><textarea id="rCode" placeholder="백업 코드"></textarea><div class="mbtns"><button class="btn primary" id="rGo">복원</button><button class="btn ghost" data-close>취소</button></div>');
    m.querySelector('#rGo').onclick=()=>{
      try{
        const d=JSON.parse(decodeURIComponent(escape(atob(m.querySelector('#rCode').value.trim()))));
        if(!d||typeof d!=='object'||!('cards' in d))throw 0;
        S=Object.assign(newSave(),d);save();closeModal();toast('복원 완료!');enterLobby();
      }catch(e){toast('코드가 올바르지 않아');}
    };
  };
  $('eReset').onclick=()=>{
    confirm2('정말 세이브를 초기화할까? 되돌릴 수 없어.')&&(localStorage.removeItem(SAVE_KEY),location.reload());
  };
  $('eMuteToggle').onclick=()=>{SFX.setMute(!SFX.isMuted());S.muted=SFX.isMuted();save();renderEtc();};
}

/* ══════════════ 50 · 부팅 ══════════════ */
function boot(){
  // 타이틀 카드
  const tc=$('titleCards');
  ['ignis','aegis','chronos'].forEach(id=>{
    const cv=mk(64,84); drawCard(cv,CARD_BY[id]); tc.appendChild(cv);
  });
  initStarter(); initNick(); initLobbyTabs();
  // 세이브
  const d=loadSave();
  if(d&&d.name){$('btnContinue').style.display='inline-flex';}
  $('btnContinue').onclick=()=>{SFX.unlock();SFX.click();S=Object.assign(newSave(),d);SFX.setMute(!!S.muted);S.deck=S.deck&&S.deck.length?S.deck:ownList().slice(0,6);enterLobby();};
  $('btnStart').onclick=()=>{
    SFX.unlock();SFX.gold();
    const d2=loadSave();
    if(d2&&d2.name){
      S=Object.assign(newSave(),d2);SFX.setMute(!!S.muted);
      S.deck=S.deck&&S.deck.length?S.deck:ownList().slice(0,6);
      enterLobby();
    } else {S=newSave();show('scrStarter');SFX.sel();}
  };
  // 전투 컨트롤
  $('btnQuit').onclick=()=>{
    if(TUT.active){confirm2('튜토리얼을 그만둘까? (스타터팩은 받을 수 있어)')&&(TUT.active=false,$('guideBox').innerHTML='',endTutorial());return;}
    confirm2('전투를 포기하고 로비로 돌아갈까?')&&(B=null,stopBattleLoop(),closeModal(),enterLobby());
  };
  $('btnSpeed').onclick=()=>{if(!B)return;B.speed=B.speed===1?2:1;$('btnSpeed').textContent=B.speed+'x';SFX.click();};
  $('btnMute').onclick=()=>{SFX.setMute(!SFX.isMuted());$('btnMute').textContent=SFX.isMuted()?'🔇':'🔊';if(S){S.muted=SFX.isMuted();save();}};
  $('endTurn').onclick=()=>{
    if(!B||B.phase!=='play')return;
    SFX.click();
    if(TUT.active&&TUT.steps[TUT.step]&&TUT.steps[TUT.step].c==='end')tutNext();
    endTurn();
  };
  // 캔버스 리사이즈
  window.fitField=function(){
    const cvs=$('field');const r=$('fieldWrap').getBoundingClientRect();
    if(r.width<10)return;
    cvs.width=Math.floor(r.width);cvs.height=Math.floor(r.height);
    if(B)layoutFoes();
  };
  window.addEventListener('resize',()=>window.fitField());
  new MutationObserver(()=>{if($('scrBattle').classList.contains('on'))window.fitField();}).observe($('scrBattle'),{attributes:true,attributeFilter:['class']});
  window.addEventListener('pointerdown',()=>SFX.unlock(),{once:true});
}
document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
