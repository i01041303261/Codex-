/* ── 뽑기 로직 ── */
function rollRarity(forceMin) {
  let r = Math.random() * 100, acc = 0;
  for (const k of RARITY_ORDER) {
    acc += RARITY[k].rate;
    if (r < acc) return (forceMin && RARITY[k].order < RARITY[forceMin].order) ? forceMin : k;
  }
  return forceMin || '일반';
}
function rollCard(forceMin) {
  const rare = rollRarity(forceMin);
  let pool = CARDS.filter(c => c.rare === rare && c.id !== 'm_genesis');
  if (!pool.length) pool = CARDS.filter(c => c.rare === '일반');
  return pick(pool).id;
}
function gachaPull(n) {
  const cost = n === 10 ? 1350 : 150;
  if (S.gold < cost) { toast('골드가 부족해 (🪙 ' + fmt(cost) + ' 필요)'); SFX.gemBad(); return; }
  S.gold -= cost;
  S.plays++; S.totalPulls += n;
  const got = [];
  let hasLegend = false;
  for (let i = 0; i < n; i++) {
    let force;
    if (S.pity >= 49) force = '전설';
    let id = rollCard(force);
    if (n === 10 && i === 9 && !hasLegend && !got.some(g => RARITY[CARD_BY[g.id].rare].order >= 3)) {
      id = pick(CARDS.filter(c => c.rare === '전설' && c.id !== 'm_genesis')).id;
    }
    const order = RARITY[CARD_BY[id].rare].order;
    if (order >= 3) hasLegend = true;
    if (order >= 3) S.pity = 0; else S.pity++;
    const isNew = giveCard(id, 1);
    got.push({ id, isNew });
  }
  if (!S.deck.length) S.deck = got.slice(0, 6).map(g => g.id);
  save(); updateCur();
  Gacha.opts = {
    mode: 'gacha',
    onDone: () => { openLobbyTab('gacha', true); }
  };
  cineOpen(got, Gacha.opts);
}
function gachaPullShard() {
  if (S.shard < 120) { toast('소환석이 부족해 (💎 120 필요)'); SFX.gemBad(); return; }
  S.shard -= 120;
  S.plays++; S.totalPulls++;
  const force = S.pity >= 49 ? '전설' : null;
  const id = rollCard(force);
  const order = RARITY[CARD_BY[id].rare].order;
  if (order >= 3) S.pity = 0; else S.pity++;
  const isNew = giveCard(id, 1);
  if (!S.deck.length) S.deck = [id];
  save(); updateCur();
  cineOpen([{ id, isNew }], { mode: 'gacha', onDone: () => openLobbyTab('gacha', true) });
}

function type3(s) { return s === 30 ? 'BOSS' : s % 10 === 0 ? 'ELITE' : '일반'; }
function stageName(c, s) {
  const ch = CHAPTERS[c];
  return s === 30 ? ch.boss : (s % 10 === 0 ? '정예 소탕' : (s % 2 ? '이동과 조우' : '카드 추적'));
}
function stageFoes(c, s) {
  const ch = CHAPTERS[c];
  const pool = ch.foes;
  const mul = 1 + c * .16;
  const base = 26 * mul + s * .9;
  if (s === 30) {
    return [
      { kind: ch.bossKind || (c === 29 ? 'lord' : pool[pool.length - 1]), hp: Math.round(base * 2.3), boss: 1, name: ch.boss },
      { kind: pool[0], hp: Math.round(base * .75), boss: 0 },
      { kind: pool[1], hp: Math.round(base * .75), boss: 0 }
    ];
  }
  if (s % 10 === 0) {
    return [
      { kind: pool[pool.length - 1], hp: Math.round(base * 1.9), elite: 1 },
      { kind: pool[1], hp: Math.round(base * 1.0) }
    ];
  }
  const n = 1 + (s % 3 === 0 ? 1 : 0) + (s % 7 === 0 ? 1 : 0);
  return Array.from({ length: Math.min(3, n) }, () => ({ kind: pick(pool), hp: Math.round(base) }));
}
function stageStory(c, s) {
  const ch = CHAPTERS[c];
  if (s === 30) return ch.st[1] + ' — 챕터의 보스가 카드를 지킨다.';
  if (s % 10 === 0) return ch.st[0] + ' 정예가 길을 막는다.';
  return ch.st[0];
}
function launchStage(c, s) {
  const ch = CHAPTERS[c];
  const foes = stageFoes(c, s);
  show('scrBattle');
  newBattle({
    title: (c + 1) + '-' + s + ' ' + ch.n, chLabel: (c + 1) + '-' + s, theme: ch.th,
    foes, baseHp: 24 * (1 + c * .16), baseAtk: 3 + c * .42 + (s >= 30 ? 3 : s >= 20 ? 1.8 : s >= 10 ? .9 : 0),
    gold: Math.round((24 + c * 12) * (s % 10 === 0 ? 1.8 : s === 30 ? 2.8 : 1)),
    shards: Math.round(2 + c * .4) * (s === 30 ? 3 : s % 10 === 0 ? 2 : 1),
    ch: c, st: s, after: 'lobbyStages'
  });
  $('btnTutSkip').style.display = 'none';
  battleRAF = requestAnimationFrame(battleLoop);
  if (s === 1) setTimeout(() => storyDialog(c), 420);
}
function storyDialog(c) {

function renderDeck() {
  const body = $('lobbyBody');
  let html = '<div class="panel"><h2>🃏 전투 덱 <span class="sub">' + S.deck.length + '/6</span></h2>' +
    '<p class="hint">전투에서는 이 6장만 써. 보유 카드를 눌러 넣고, 슬롯을 눌러 빼. 길게 누르면 상세.</p>' +
    '<div class="deck-slots">';
  for (let i = 0; i < 6; i++) {
    const id = S.deck[i];
    html += '<div class="slot" data-slot="' + i + '">' + (id && CARD_BY[id] ? '' : '빈 슬롯') + (id ? '<div class="rm">✕</div>' : '') + '</div>';
  }
  html += '</div><div class="deck-summary"><span class="stat">평균 위력 <b>' + deckPower() + '</b></span>' +
    '<span class="stat">Lv.<b>' + playerLevel() + '</b></span>' +
    '<span class="stat">보유 <b>' + ownList().length + '</b>종</span></div>' +
    '<button class="btn ghost sm" id="autoDeck">✨ 자동 편성</button></div>';
  html += '<div class="panel"><h2>보유 카드 <span class="sub">' + ownList().length + '종</span></h2><div class="card-grid" id="deckPool"></div></div>';
  body.innerHTML = html;
  // 슬롯에 카드 렌더
  $$('.slot', body).forEach(sl => {
    const i = +sl.dataset.slot, id = S.deck[i];
    if (id && CARD_BY[id]) {
      const el = cardEl(CARD_BY[id], { foil: false, lv: true, compact: true });
      el.style.pointerEvents = 'none';
      const nm = document.createElement('div');
      nm.className = 'slot-nm'; nm.textContent = CARD_BY[id].name;
      el.appendChild(nm);
      sl.appendChild(el);
    }
    sl.onclick = () => {
      if (!S.deck[i]) return;
      SFX.ui(); S.deck.splice(i, 1); save(); renderDeck();
    };
  });
  const pool = $('deckPool');
  const own = ownList().map(id => CARD_BY[id]).filter(Boolean).sort((a, b) => RARITY[b.rare].order - RARITY[a.rare].order || a.name.localeCompare(b.name));
  own.forEach(c => {
    const inDeck = S.deck.includes(c.id);
    const el = cardEl(c, { dup: true, cls: inDeck ? 'in-deck' : '' });
    el.onclick = () => {
      SFX.ui();
      if (S.deck.includes(c.id)) S.deck = S.deck.filter(x => x !== c.id);
      else {
        if (S.deck.length >= 6) { toast('덱이 가득 찼어 (6장)'); return; }
        S.deck.push(c.id);
      }
      save(); renderDeck();
    };
    let holdT = null;
    el.addEventListener('pointerdown', () => {
      holdT = setTimeout(() => { holdT = null; showCardDetail(c.id); }, 520);
    });
    const clear = () => { if (holdT) { clearTimeout(holdT); holdT = null; } };
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointerleave', clear);
    el.addEventListener('pointercancel', clear);
    el.addEventListener('contextmenu', e => { e.preventDefault(); showCardDetail(c.id); });
    pool.appendChild(el);
  });
  const auto = $('autoDeck');
  if (auto) auto.onclick = () => {
    S.deck = ownList().map(id => CARD_BY[id]).sort((a, b) => {
      const pa = cardPower(a).val * (RARITY[a.rare].order + 1), pb = cardPower(b).val * (RARITY[b.rare].order + 1);
      return pb - pa;
    }).slice(0, 6).map(c => c.id);
    save(); SFX.buff(); toast('자동 편성 완료'); renderDeck();
  };
}

function showCardDetail(id) {
  const c = CARD_BY[id]; if (!c) return;
  const cp = cardPower(c), lv = cardLv(id), R = RARITY[c.rare], own = S.cards[id] || 0;
  const m = modal('<h2>' + esc(c.name) + '</h2>' +
    '<div style="display:flex;justify-content:center;margin-bottom:10px"><div id="detailCard" style="width:min(200px,52vw)"></div></div>' +
    '<p class="center" style="margin-bottom:8px">' + esc(c.desc) + '</p>' +
    '<div class="stat-row" style="justify-content:center">' +
    '<span class="stat" style="color:' + R.color + '">' + c.rare + '</span>' +
    '<span class="stat">코스트 <b>' + cardCost(c) + '</b></span>' +
    '<span class="stat">속성 <b style="color:' + elData(c.el).col + '">' + elData(c.el).name + '</b></span>' +
    '<span class="stat">Lv.<b>' + lv + '</b></span>' +
    '<span class="stat">보유 <b>×' + own + '</b></span>' +
    '</div>' +
    '<div class="mbtns" id="detailBtns"></div>' +
    '<div class="mbtns"><button class="btn ghost sm" data-close>닫기</button></div>');
  const holder = m.querySelector('#detailCard');
  holder.appendChild(cardEl(c, { lv: true }));
  const btns = m.querySelector('#detailBtns');
  if (own >= 3) {
    const b = document.createElement('button');
    b.className = 'btn gold sm';
    b.textContent = '🔄 합성 강화 (2장 소모 → Lv.' + (lv + 1) + ')';
    b.onclick = () => {
      S.cards[id] -= 2; if (S.cards[id] <= 0) delete S.cards[id];
      S.lv[id] = lv + 1; save(); SFX.buff();
      toast(c.name + ' Lv.' + (lv + 1) + ' 달성!');
      closeModal();
      if (lobbyTab === 'deck') renderDeck(); else if (lobbyTab === 'cards') renderCards(); else renderDex();
      updateCur();
    };
    btns.appendChild(b);
  } else if (own === 2) {
    const b = document.createElement('button');
    b.className = 'btn ghost sm';
    b.textContent = '합성에는 3장이 필요해 (현재 2장)';
    b.disabled = true;
    btns.appendChild(b);
  }
  if (own > 0 && !S.deck.includes(id)) {
    const b = document.createElement('button');
    b.className = 'btn primary sm';
    b.textContent = '🃏 덱에 넣기';
    b.onclick = () => {
      if (S.deck.length >= 6) { toast('덱이 가득 찼어'); return; }
      S.deck.push(id); save(); SFX.uiSel(); toast('덱에 추가했어'); closeModal();
      if (lobbyTab === 'deck') renderDeck();
    };
    btns.appendChild(b);
  }
}

/* ── 보유 카드 ── */
function renderCards() {
  const body = $('lobbyBody');
  const own = ownList().map(id => CARD_BY[id]).filter(Boolean).sort((a, b) => RARITY[b.rare].order - RARITY[a.rare].order || a.name.localeCompare(b.name));
  let html = '<div class="panel"><h2>📚 보유 카드 <span class="sub">' + own.length + '종</span></h2>' +
    '<p class="hint">카드를 누르면 상세 · 중복 2장을 소모해 <b>합성 강화</b>. 길게 눌러도 상세가 열려.</p><div class="card-grid" id="cardsGrid"></div></div>';
  body.innerHTML = html;
  const grid = $('cardsGrid');
  if (!own.length) grid.innerHTML = '<p class="hint">보유 카드가 없어. 소환으로 카드를 모아봐!</p>';
  own.forEach(c => {
    const el = cardEl(c, { lv: true, dup: true });
    el.onclick = () => showCardDetail(c.id);
    grid.appendChild(el);
  });
}

/* ── 도감 ── */
function renderDex() {
  const body = $('lobbyBody');
  const got = CARDS.filter(c => S.dex[c.id] || S.cards[c.id]);
  body.innerHTML = '<div class="panel"><h2>📖 카드 도감 <span class="sub">' + got.length + '/' + CARDS.length + '</span></h2>' +
    '<p class="hint">모든 카드를 수집하라. 미획득 카드는 실루엣으로 표시돼.</p><div class="card-grid" id="dexGrid"></div></div>';
  const grid = $('dexGrid');
  CARDS.forEach(c => {
    const has = !!(S.dex[c.id] || S.cards[c.id]);
    if (has) {
      const el = cardEl(c, { lv: true });
      el.onclick = () => showCardDetail(c.id);
      grid.appendChild(el);
    } else {
      const d = document.createElement('div');
      d.className = 'card';
      const cv = document.createElement('canvas'); cv.width = 220; cv.height = 300;
      d.appendChild(cv);
      drawCardBack(cv);
      const veil = document.createElement('div'); veil.className = 'lock-veil'; veil.textContent = '❔';
      d.appendChild(veil);
      const nm = document.createElement('div');
      nm.className = 'badge-lv'; nm.textContent = '???';
      d.appendChild(nm);
      grid.appendChild(d);
    }
  });
}

/* ── 설정 ── */
function renderEtc() {
  const body = $('lobbyBody');
  body.innerHTML = '<div class="panel"><h2>⚙️ 설정</h2>' +
    '<div class="stat-row"><span class="stat">소환 <b>' + fmt(S.totalPulls) + '회</b></span>' +
    '<span class="stat">승리 <b>' + S.wins + '</b></span>' +
    '<span class="stat">아레나 <b>' + S.arenaPts + 'pt</b></span>' +
    '<span class="stat">도감 <b>' + CARDS.filter(c => S.dex[c.id]).length + '/' + CARDS.length + '</b></span></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' +
    '<button class="btn ghost block" id="eMute">' + (SFX.isMuted() ? '🔇 소리 켜기' : '🔊 소리 끄기') + '</button>' +
    '<button class="btn ghost block" id="eBackup">💾 세이브 백업 코드</button>' +
    '<button class="btn ghost block" id="eRestore">📥 세이브 복원</button>' +
    '<button class="btn danger block" id="eReset">🗑️ 세이브 초기화</button>' +
    '</div>' +
    '<p class="hint" style="margin-top:12px">무한의 군주 카드 RPG · v2<br>카드 ' + CARDS.length + '종 · 30챕터 × 30스테이지 · 아레나 6등급</p></div>';
  $('eMute').onclick = () => { SFX.setMute(!SFX.isMuted()); S.muted = SFX.isMuted(); save(); updateMuteBtn(); renderEtc(); SFX.ui(); };
  $('eBackup').onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const m = modal('<h2>💾 세이브 백업</h2><p class="center hint">아래 코드를 복사해 보관해라.</p><textarea readonly id="bkCode">' + code + '</textarea><div class="mbtns"><button class="btn primary" data-close>닫기</button></div>');
    const ta = m.querySelector('#bkCode');
    setTimeout(() => { ta.focus(); ta.select(); }, 100);
  };
  $('eRestore').onclick = () => {
    const m = modal('<h2>📥 세이브 복원</h2><p class="center hint">백업 코드를 붙여넣어라.</p><textarea id="rsCode" placeholder="백업 코드"></textarea>' +
      '<div class="mbtns"><button class="btn primary" id="rsGo">복원</button><button class="btn ghost" data-close>취소</button></div>');
    m.querySelector('#rsGo').onclick = () => {
      try {
        const raw = m.querySelector('#rsCode').value.trim();
        const d = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (!d || typeof d !== 'object' || !('cards' in d)) throw new Error('bad');
        S = normalizeSave(d); save(); closeModal(); toast('복원 완료!'); enterLobby();
      } catch (e) { toast('코드가 올바르지 않아'); }
    };
  };
  $('eReset').onclick = () => {
    if (confirm2('정말 세이브를 초기화할까? 되돌릴 수 없어.')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
  };
}

/* ══════════════ 08 · 부팅 ══════════════ */
function initTitle() {
  const tc = $('titleCards');
  if (tc) {
    tc.innerHTML = '';
    ['ignis', 'aegis', 'chronos'].forEach((id, i) => {
      const cv = document.createElement('canvas');
      cv.width = 220; cv.height = 300;
      cv.style.width = 'clamp(56px,17vw,88px)';
      cv.style.height = 'auto';
      cv.style.borderRadius = '8px';
      cv.style.boxShadow = '0 14px 26px rgba(0,0,0,.6)';
      cv.style.animation = 'floaty 3.6s ease-in-out infinite';
      cv.style.animationDelay = (i * .4) + 's';
      drawCardFace(cv, CARD_BY[id], { lv: 1 });
      tc.appendChild(cv);
    });
  }
  // 타이틀 마법진
  const cv2 = $('titleCircle');
  if (cv2) {
    const g = cv2.getContext('2d');
    const loop = (t) => {
      if (curScreen !== 'scrTitle') { setTimeout(() => requestAnimationFrame(loop), 600); return; }
      const W = cv2.width, H = cv2.height;
      g.clearRect(0, 0, W, H);
      g.save(); g.translate(W / 2, H / 2);
      g.globalCompositeOperation = 'lighter';
      g.rotate(t * .00008);
      drawSigil(g, 0, 0, W * .34, 4242, '#c58bff', t);
      g.rotate(-t * .00018);
      drawSigil(g, 0, 0, W * .26, 991, '#f5c96a', t);
      g.restore();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}
function boot() {
  SFX.setMute(false);
  BG.init();
  const foot = document.querySelector('.title-foot');
  if (foot) foot.textContent = '30 CHAPTERS · 900 STAGES · ' + CARDS.length + ' CARDS';
  initTitle();
  initStarter(); initNick(); initLobbyTabs();
  const d = loadSave();
  if (d && d.name) {
    const bc = $('btnContinue'); bc.style.display = 'flex';
    bc.onclick = () => {
      SFX.unlock(); SFX.uiSel();
      S = normalizeSave(d);
      SFX.setMute(!!S.muted); updateMuteBtn();
      enterLobby();
    };
  }
  $('btnStart').onclick = () => {
    SFX.unlock(); SFX.gold();
    const d2 = loadSave();
    if (d2 && d2.name) {
      S = normalizeSave(d2);
      SFX.setMute(!!S.muted); updateMuteBtn();
      enterLobby();
    } else {
      S = newSave();
      show('scrStarter');
      SFX.uiSel();
    }
  };
  // 전투 컨트롤
  $('btnQuit').onclick = () => {
    if (TUT.active) {
      if (confirm2('튜토리얼을 그만둘까? (스타터팩은 받을 수 있어)')) { TUT.active = false; TUT.clearTimer(); endTutorial(); }
      return;
    }
    if (confirm2('전투를 포기하고 로비로 돌아갈까?')) { B = null; stopBattleLoop(); closeModal(); enterLobby(); }
  };
  $('btnSpeed').onclick = () => {
    if (!B) return;
    B.speed = B.speed === 1 ? 2 : 1;
    $('btnSpeed').textContent = B.speed + '×';
    SFX.ui();
  };
  $('btnMute').onclick = () => {
    SFX.setMute(!SFX.isMuted()); updateMuteBtn();
    if (S) { S.muted = SFX.isMuted(); save(); }
    SFX.ui();
  };
  $('endTurn').onclick = () => {
    if (!B || B.phase !== 'play') return;
    SFX.ui();
    if (TUT.active) tutHook('end');
    endTurn();
  };
  $('btnAuto').onclick = () => { SFX.ui(); toggleAuto(); };
  $('exBtn').onclick = () => {
    if (!B || B.phase !== 'play') return;
    if (B.player.od < 100) { toast('오버드라이브 ' + Math.round(B.player.od) + '% · 100%에 발동'); SFX.gemBad(); return; }
    SFX.gold(); fireEX();
  };
  $('btnTutSkip').onclick = () => { if (confirm2('튜토리얼을 건너뛰고 스타터팩을 받을까?')) endTutorial(); };
  // 리사이즈
  const refit = () => { if (B) fitField(); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', () => setTimeout(refit, 220));
  new MutationObserver(() => { if ($('scrBattle').classList.contains('on') && B) fitField(); })
    .observe($('scrBattle'), { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('pointerdown', () => SFX.unlock(), { once: true });
  // 전역 오류 로깅 보조
  window.__gameReady = true;
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
