<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>원소맞추기 게임 · NEON LAB</title>
<style>
  :root{
    --ink:#e9f4ff; --muted:#8aa3c4; --line:rgba(120,200,255,.18);
    --neon:#39e6ff; --neon2:#8b5cf6; --pink:#ff5fa2; --lime:#7dffb0; --amber:#ffd166;
    --bg:#03060f; --panel:rgba(8,16,30,.82);
    --ease:cubic-bezier(.22,1,.36,1); --pad-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",system-ui,sans-serif;
    background:var(--bg);display:flex;justify-content:center;padding:12px 12px calc(18px + var(--pad-b));
    touch-action:manipulation;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(760px 480px at 12% -8%,rgba(57,230,255,.2),transparent 62%),
      radial-gradient(680px 460px at 92% 4%,rgba(139,92,246,.22),transparent 64%),
      radial-gradient(700px 520px at 50% 112%,rgba(255,95,162,.14),transparent 66%),
      linear-gradient(170deg,#050a16,#02040c 60%,#01030a);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
    background-image:
      linear-gradient(rgba(57,230,255,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(57,230,255,.07) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 24%,#000 8%,transparent 72%);
            mask-image:radial-gradient(circle at 50% 24%,#000 8%,transparent 72%);
  }
  .app{width:100%;max-width:820px;position:relative}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font-size:16px;
    background:linear-gradient(150deg,rgba(57,230,255,.22),rgba(139,92,246,.22));border:1px solid rgba(57,230,255,.45);
    box-shadow:0 0 22px -6px rgba(57,230,255,.9)}
  .brand b{font-size:.85rem;letter-spacing:.04em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;font-size:1rem;
    border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--ink);transition:.18s;touch-action:manipulation}
  .icon:hover{background:rgba(57,230,255,.14);border-color:rgba(57,230,255,.5)}
  .icon[data-off="1"]{opacity:.5}
  .screen{display:none}
  .screen.active{display:block;animation:fade .32s var(--ease) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{position:relative;background:linear-gradient(158deg,var(--panel),rgba(4,8,18,.94));
    border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 26px 60px -30px #000;
    overflow:hidden;margin-bottom:10px}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(57,230,255,.75),transparent)}
  h1{font-size:clamp(1.5rem,6.2vw,2.1rem);line-height:1.2;letter-spacing:-.01em}
  h1 .glow{color:var(--neon);text-shadow:0 0 24px rgba(57,230,255,.8),0 0 60px rgba(57,230,255,.35)}
  h2{font-size:1.05rem;letter-spacing:.01em}
  p{font-size:.85rem;line-height:1.68;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;border-radius:12px;transition:.16s var(--ease)}
  button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;min-height:46px;
    font-size:.9rem;font-weight:800;border:1px solid rgba(57,230,255,.45);color:#03151b;
    background:linear-gradient(150deg,#5ceaff,#2fb6d8);box-shadow:0 16px 30px -18px rgba(57,230,255,.95),inset 0 1px 0 rgba(255,255,255,.45)}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line);box-shadow:none}
  .btn.ghost:hover{background:rgba(57,230,255,.1);border-color:rgba(57,230,255,.45)}
  .btn.violet{background:linear-gradient(150deg,#a98bfb,#7c4dff);color:#0b0418;border-color:#c4aeff;
    box-shadow:0 16px 30px -18px rgba(124,77,255,.95),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.block{width:100%}
  .home-wrap{text-align:center;padding:26px 18px 22px}
  .home-wrap .atom-hero{width:172px;height:172px;margin:6px auto 10px;position:relative}
  .home-wrap h1{margin-bottom:8px}
  .home-wrap p{max-width:440px;margin:0 auto 6px}
  .feature-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
  .pill{font-size:.68rem;font-weight:800;letter-spacing:.04em;padding:6px 11px;border-radius:99px;
    border:1px solid rgba(57,230,255,.32);color:#a9edff;background:rgba(57,230,255,.08)}
  .pill.v{border-color:rgba(139,92,246,.4);color:#cdb9ff;background:rgba(139,92,246,.1)}
  .pill.p{border-color:rgba(255,95,162,.4);color:#ffb6d0;background:rgba(255,95,162,.1)}
  /* 상단 상태 */
  .topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .counter{font-size:.78rem;color:#bcd4ee;font-weight:700;letter-spacing:.02em}
  .counter b{color:#fff}
  .scorebox{font-size:.78rem;color:#bcd4ee;font-weight:700}
  .scorebox b{color:var(--amber);font-size:1rem}
  .progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px;
    border:1px solid rgba(255,255,255,.06)}
  .progress i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#39e6ff,#8b5cf6 60%,#ff5fa2);transition:width .4s var(--ease);
    box-shadow:0 0 14px rgba(57,230,255,.8)}
  /* 원소 카드 */
  .el-card{position:relative;border-radius:18px;padding:18px 16px 16px;overflow:hidden;
    border:1px solid color-mix(in srgb,var(--fam,#39e6ff) 55%,transparent);
    background:
      radial-gradient(340px 220px at 50% 0%,color-mix(in srgb,var(--fam,#39e6ff) 22%,transparent),transparent 70%),
      linear-gradient(165deg,rgba(10,20,36,.96),rgba(3,6,14,.98));
    box-shadow:0 26px 60px -30px #000,inset 0 0 60px color-mix(in srgb,var(--fam,#39e6ff) 8%,transparent)}
  .el-card .famline{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
  .el-card .zub{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--fam,#39e6ff)}
  .el-card .famchip{font-size:.63rem;font-weight:800;padding:5px 9px;border-radius:99px;letter-spacing:.04em;
    color:#031018;background:var(--fam,#39e6ff);box-shadow:0 0 18px color-mix(in srgb,var(--fam,#39e6ff) 60%,transparent)}
  .atom-box{position:relative;height:190px;display:grid;place-items:center;margin:6px 0 2px}
  .atom{position:absolute;inset:0;display:grid;place-items:center}
  .atom .ring{position:absolute;top:50%;left:50%;translate:-50% -50%;border-radius:50%;border:1px solid color-mix(in srgb,var(--fam,#39e6ff) 45%,transparent);
    box-shadow:0 0 22px -8px color-mix(in srgb,var(--fam,#39e6ff) 70%,transparent)}
  .atom .ring.r1{width:132px;height:132px;animation:spinA 7s linear infinite}
  .atom .ring.r2{width:158px;height:158px;animation:spinB 10s linear infinite;border-color:color-mix(in srgb,var(--neon2) 45%,transparent)}
  .atom .ring.r3{width:184px;height:184px;animation:spinC 14s linear infinite;border-color:color-mix(in srgb,var(--pink) 35%,transparent)}
  .atom .ring::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;translate:-50% 0;
    background:var(--fam,#39e6ff);box-shadow:0 0 14px 2px color-mix(in srgb,var(--fam,#39e6ff) 80%,transparent)}
  .atom .ring.r2::after{background:var(--neon2);box-shadow:0 0 14px 2px rgba(139,92,246,.85)}
  .atom .ring.r3::after{background:var(--pink);box-shadow:0 0 14px 2px rgba(255,95,162,.85)}
  @keyframes spinA{from{transform:rotate(0) rotateX(62deg)}to{transform:rotate(360deg) rotateX(62deg)}}
  @keyframes spinB{from{transform:rotate(60deg) rotateY(58deg)}to{transform:rotate(420deg) rotateY(58deg)}}
  @keyframes spinC{from{transform:rotate(-40deg) rotateX(24deg)}to{transform:rotate(320deg) rotateX(24deg)}}
  .atom .core{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 36% 30%,color-mix(in srgb,var(--fam,#39e6ff) 55%,#fff 10%),color-mix(in srgb,var(--fam,#39e6ff) 32%,#050a14) 62%,#04070f);
    box-shadow:0 0 44px color-mix(in srgb,var(--fam,#39e6ff) 55%,transparent),inset 0 0 22px rgba(255,255,255,.18);
    border:1px solid color-mix(in srgb,var(--fam,#39e6ff) 60%,#fff 10%)}
  .atom .core b{font-size:2.35rem;font-weight:900;letter-spacing:-.03em;color:#fff;
    text-shadow:0 0 18px color-mix(in srgb,var(--fam,#39e6ff) 80%,transparent),0 2px 6px rgba(0,0,0,.7);line-height:1}
  .el-name{text-align:center;position:relative;z-index:2}
  .el-name .ko{font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
  .el-name .en{font-size:.72rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .el-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px;position:relative;z-index:2}
  .el-meta div{border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px 6px;text-align:center;background:rgba(255,255,255,.03)}
  .el-meta b{display:block;font-size:.58rem;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
  .el-meta span{font-size:.82rem;font-weight:800;color:#eaf4ff}
  /* 퀴즈 */
  .quiz-hint{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 2px}
  .mini-atom{position:relative;width:64px;height:64px;flex:0 0 auto}
  .mini-atom .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(57,230,255,.4);animation:spinA 6s linear infinite}
  .mini-atom .ring.b{inset:6px;border-color:rgba(139,92,246,.45);animation-duration:9s;animation-direction:reverse}
  .mini-atom .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;translate:-50% -50%;
    background:radial-gradient(circle,#bff5ff,#39e6ff);box-shadow:0 0 18px rgba(57,230,255,.9)}
  .qtext{text-align:center;font-size:clamp(1.05rem,4.6vw,1.34rem);font-weight:800;line-height:1.5;margin:10px 0 4px;word-break:keep-all}
  .qtext span{color:var(--amber);text-shadow:0 0 18px rgba(255,209,102,.5)}
  .answer{display:flex;gap:8px;margin-top:14px}
  input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid rgba(57,230,255,.35);
    background:rgba(2,6,14,.9);color:#eafcff;font-family:inherit;font-size:1.16rem;text-align:center;outline:none;
    letter-spacing:.16em;text-transform:uppercase;transition:.18s;box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}
  input::placeholder{letter-spacing:0;text-transform:none;font-size:.9rem;color:#5f7893}
  input:focus{border-color:var(--neon);box-shadow:inset 0 2px 10px rgba(0,0,0,.7),0 0 0 3px rgba(57,230,255,.16)}
  .answer .btn{flex:0 0 auto;padding:12px 16px}
  .feedback{min-height:30px;margin-top:11px;text-align:center;font-size:.86rem;font-weight:800;line-height:1.5}
  .feedback.ok{color:#7dffb0;text-shadow:0 0 14px rgba(125,255,176,.45)}
  .feedback.no{color:#ff9ab6}
  .combo{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:900;padding:5px 10px;border-radius:99px;
    color:#1b0a00;background:linear-gradient(120deg,#ffd166,#ff9a4d);box-shadow:0 0 20px rgba(255,180,80,.6);
    opacity:0;transform:scale(.9);transition:.25s var(--ease)}
  .combo.on{opacity:1;transform:none;animation:comboP 1.2s ease-in-out infinite}
  @keyframes comboP{0%,100%{box-shadow:0 0 12px rgba(255,180,80,.4)}50%{box-shadow:0 0 26px rgba(255,180,80,.85)}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;margin-top:14px}
  .mini{border-radius:10px;padding:9px 6px;text-align:center;border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.035)}
  .mini b{display:block;font-size:1rem;font-weight:900;color:#dff7ff;line-height:1.2}
  .mini span{font-size:.64rem;color:var(--muted)}
  .mini.ok{border-color:rgba(125,255,176,.45);background:rgba(125,255,176,.08)}
  .mini.bad{border-color:rgba(255,95,162,.4);background:rgba(255,95,162,.08)}
  .mini .z{display:block;font-size:.55rem;color:#6e8aa6}
  .result-wrap{text-align:center;padding:22px 16px}
  .result-wrap h2{font-size:1.42rem;margin-bottom:6px}
  .bigscore{display:inline-flex;align-items:baseline;gap:6px;margin:12px 0;padding:12px 22px;border-radius:16px;
    border:1px solid rgba(57,230,255,.35);background:rgba(57,230,255,.08)}
  .bigscore b{font-size:2.4rem;color:#8ff3ff;line-height:1;text-shadow:0 0 24px rgba(57,230,255,.7)}
  .bigscore span{font-size:.9rem;color:#9fd7e8}
  .result-msg{font-size:.88rem;color:#cfe4f5;line-height:1.7}
  .stats-line{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
  .label{font-size:.66rem;letter-spacing:.18em;color:var(--neon);font-weight:800;margin-bottom:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  #toast{position:fixed;left:50%;bottom:calc(16px + var(--pad-b));translate:-50% 0;z-index:60;
    background:rgba(6,14,26,.96);border:1px solid rgba(57,230,255,.5);color:#9ff0ff;padding:9px 16px;border-radius:99px;
    font-size:.78rem;opacity:0;pointer-events:none;transition:.28s;transform:translate(-50%,8px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:520px){
    .home-wrap .atom-hero{width:148px;height:148px}
    .atom-box{height:170px}
    .atom .ring.r1{width:118px;height:118px}
    .atom .ring.r2{width:142px;height:142px}
    .atom .ring.r3{width:166px;height:166px}
    .atom .core{width:86px;height:86px}
    .atom .core b{font-size:2.05rem}
    .answer{flex-direction:column}
    .answer .btn{width:100%}
    .el-name .ko{font-size:1.32rem}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="mk">🧪</span><b>NEON LAB · 원소맞추기</b></div>
    <button class="icon" id="muteBtn" title="효과음" aria-label="효과음 켜기/끄기">🔊</button>
  </div>

  <!-- 홈 -->
  <section id="home" class="screen active">
    <div class="card home-wrap">
      <div class="atom-hero">
        <div class="atom">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <div class="core"><b>Eh</b></div>
        </div>
      </div>
      <h1>🧪 <span class="glow">원소</span>맞추기 게임</h1>
      <p>원소를 재밌게 외워볼까요? 첫 50개 원소의 기호와 이름을 랜덤 순서로 익힌 뒤, 원소 맞추기 문제에 도전해보세요!</p>
      <div class="feature-row">
        <span class="pill">주기율표 1~50번</span>
        <span class="pill v">학습 50컷</span>
        <span class="pill p">퀴즈 20문제</span>
      </div>
      <button id="startBtn" class="btn block">원소 외우러 가기 🚀</button>
    </div>
  </section>

  <!-- 학습 -->
  <section id="learn" class="screen">
    <div class="topline">
      <span class="counter" id="learnCount">1 / 50</span>
      <button id="homeBtn1" class="btn ghost" style="min-height:34px;padding:7px 13px;font-size:.76rem">홈</button>
    </div>
    <div class="progress"><i id="learnBar"></i></div>
    <div class="el-card" id="learnCard">
      <div class="famline">
        <span class="zub" id="learnFam">ALKALI METAL</span>
        <span class="famchip" id="learnFamKo">알칼리 금속</span>
      </div>
      <div class="atom-box">
        <div class="atom">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <div class="core"><b id="symbol">H</b></div>
        </div>
      </div>
      <div class="el-name">
        <div class="ko" id="elementName">수소</div>
        <div class="en" id="elementEn">HYDROGEN</div>
      </div>
      <div class="el-meta">
        <div><b>원자번호</b><span id="atomicNumber">1</span></div>
        <div><b>원자량</b><span id="mass">1.008</span></div>
        <div><b>계열</b><span id="learnFamShort">-</span></div>
      </div>
    </div>
    <button id="nextBtn" class="btn block">다음 원소 →</button>
    <p style="text-align:center;font-size:.72rem;margin-top:8px">기호와 이름을 소리 내어 읽으면 더 잘 외워져요 🔬</p>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="screen">
    <div class="topline">
      <span class="counter" id="quizCount">1 / 20</span>
      <span class="scorebox">점수 <b id="score">0</b></span>
    </div>
    <div class="progress"><i id="quizBar"></i></div>
    <div class="card">
      <div class="quiz-hint">
        <div class="mini-atom"><span class="ring"></span><span class="ring b"></span><span class="dot"></span></div>
        <div style="text-align:left">
          <div class="label" style="margin-bottom:2px">ELEMENT QUIZ</div>
          <div style="font-size:.76rem;color:var(--muted)">이름을 보고 기호를 입력하세요</div>
        </div>
        <div style="margin-left:auto"><span class="combo" id="combo">🔥 0 COMBO</span></div>
      </div>
      <h2 style="text-align:center;margin-top:6px">🎯 원소 맞추기</h2>
      <p id="question" class="qtext"></p>
      <div class="answer">
        <input id="answerInput" type="text" placeholder="원소 기호를 입력하세요" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="원소 기호 입력">
        <button id="submitBtn" class="btn">정답 확인</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen">
    <div class="card result-wrap">
      <h2>🎉 퀴즈 완료!</h2>
      <div class="bigscore"><b id="resultScore">0</b><span>/ 20</span></div>
      <p id="resultText" class="result-msg"></p>
      <div class="stats-line" id="resultStats"></div>
      <div id="reviewGrid" class="grid"></div>
      <div class="row">
        <button id="retryBtn" class="btn violet">다시 도전하기 🔁</button>
        <button id="homeBtn2" class="btn ghost">홈으로</button>
      </div>
    </div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ── 원소 데이터 (첫 50개 · 기존과 동일) ─────────────── */
const elements = [
["H","수소",1,"1.008"],["He","헬륨",2,"4.003"],["Li","리튬",3,"6.94"],["Be","베릴륨",4,"9.012"],["B","붕소",5,"10.81"],
["C","탄소",6,"12.011"],["N","질소",7,"14.007"],["O","산소",8,"15.999"],["F","플루오린",9,"18.998"],["Ne","네온",10,"20.180"],

/* 원소별 영문명·계열 (색상 구분용) */
const EN = {H:"Hydrogen",He:"Helium",Li:"Lithium",Be:"Beryllium",B:"Boron",C:"Carbon",N:"Nitrogen",O:"Oxygen",F:"Fluorine",Ne:"Neon",
Na:"Sodium",Mg:"Magnesium",Al:"Aluminium",Si:"Silicon",P:"Phosphorus",S:"Sulfur",Cl:"Chlorine",Ar:"Argon",K:"Potassium",Ca:"Calcium",
Sc:"Scandium",Ti:"Titanium",V:"Vanadium",Cr:"Chromium",Mn:"Manganese",Fe:"Iron",Co:"Cobalt",Ni:"Nickel",Cu:"Copper",Zn:"Zinc",
Ga:"Gallium",Ge:"Germanium",As:"Arsenic",Se:"Selenium",Br:"Bromine",Kr:"Krypton",Rb:"Rubidium",Sr:"Strontium",Y:"Yttrium",Zr:"Zirconium",
Nb:"Niobium",Mo:"Molybdenum",Tc:"Technetium",Ru:"Ruthenium",Rh:"Rhodium",Pd:"Palladium",Ag:"Silver",Cd:"Cadmium",In:"Indium",Sn:"Tin"};

const FAM = {
  alkali:      { ko:"알칼리 금속",   en:"ALKALI METAL",    color:"#ff6b8a" },
  alkaline:    { ko:"알칼리 토금속", en:"ALKALINE EARTH",  color:"#ffa94d" },
  transition:  { ko:"전이 금속",     en:"TRANSITION METAL",color:"#6ea8ff" },
  posttrans:   { ko:"전이후 금속",   en:"POST-TRANSITION", color:"#7ee0b8" },
  metalloid:   { ko:"준금속",        en:"METALLOID",       color:"#b28dff" },
  nonmetal:    { ko:"비금속",        en:"NONMETAL",        color:"#5ee7a0" },
  halogen:     { ko:"할로겐",        en:"HALOGEN",         color:"#ffe066" },
  noble:       { ko:"비활성 기체",   en:"NOBLE GAS",       color:"#8ce3ff" }
};
const FAMOF = {
  H:"nonmetal", He:"noble", Li:"alkali", Be:"alkaline", B:"metalloid", C:"nonmetal", N:"nonmetal", O:"nonmetal", F:"halogen", Ne:"noble",
  Na:"alkali", Mg:"alkaline", Al:"posttrans", Si:"metalloid", P:"nonmetal", S:"nonmetal", Cl:"halogen", Ar:"noble", K:"alkali", Ca:"alkaline",
  Sc:"transition", Ti:"transition", V:"transition", Cr:"transition", Mn:"transition", Fe:"transition", Co:"transition", Ni:"transition",
  Cu:"transition", Zn:"transition", Ga:"posttrans", Ge:"metalloid", As:"metalloid", Se:"nonmetal", Br:"halogen", Kr:"noble",
  Rb:"alkali", Sr:"alkaline", Y:"transition", Zr:"transition", Nb:"transition", Mo:"transition", Tc:"transition", Ru:"transition",
  Rh:"transition", Pd:"transition", Ag:"transition", Cd:"transition", In:"posttrans", Sn:"posttrans"
};
function famOf(sym){ return FAM[FAMOF[sym]||"nonmetal"]; }

/* ── 상태 ─────────────────────────────────────────── */
let learnList=[], learnIndex=0, quizList=[], quizIndex=0, score=0, answered=false, combo=0, bestCombo=0;

const $ = function(id){ return document.getElementById(id); };
function show(id){
  ["home","learn","quiz","result"].forEach(function(x){ $(x).classList.toggle("active", x===id); });
  window.scrollTo(0,0);
}

/* ── 사운드 ───────────────────────────────────────── */
let actx=null, muted=false;
try{ muted = localStorage.getItem("elements-mute")==="1"; }catch(e){}
function ac(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx && actx.state==="suspended"){ try{actx.resume();}catch(e){} }
  return actx;
}
function tone(freq,dur,type,vol,delay,slideTo){
  if(muted) return; const c=ac(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol==null?.13:vol,t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.03);
}
const sfx={
  tap(){ tone(700,.05,"triangle",.05); },
  ok(){ tone(880,.09,"triangle",.11); tone(1245,.12,"triangle",.09,null,.07); },
  no(){ tone(200,.2,"sawtooth",.1,0,120); },
  combo(){ [1046,1318,1568].forEach(function(f,i){ tone(f,.14,"triangle",.09,i*.05); }); },
  finish(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,.3,"triangle",.11,i*.09); }); }
};
function syncMute(){
  const b=$("muteBtn"); if(!b) return;
  b.textContent = muted?"🔇":"🔊"; b.setAttribute("data-off", muted?"1":"0");
}
$("muteBtn").addEventListener("click",function(){
  muted=!muted;
  try{ localStorage.setItem("elements-mute", muted?"1":"0"); }catch(e){}
  syncMute(); if(!muted) sfx.tap();
  toast(muted?"🔇 효과음 꺼짐":"🔊 효과음 켜짐");
});
syncMute();
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },1500);
}

/* ── 학습 ─────────────────────────────────────────── */
function shuffle(arr){ return arr.slice().sort(function(){ return Math.random()-0.5; }); }

function startLearning(){
  ac();
  learnList = shuffle(elements);
  learnIndex = 0;
  show("learn");
  renderLearn();
}

function renderLearn(){
  const e = learnList[learnIndex];
  const fam = famOf(e[0]);
  $("learnCount").innerHTML = "<b>"+(learnIndex+1)+"</b> / 50";
  $("learnBar").style.width = ((learnIndex+1)/50*100)+"%";

  const card = $("learnCard");
  card.style.setProperty("--fam", fam.color);

  $("atomicNumber").textContent = e[2];
  $("symbol").textContent = e[0];
  $("elementName").textContent = e[1];
  $("elementEn").textContent = (EN[e[0]]||"").toUpperCase();
  $("mass").textContent = e[3];
  $("learnFam").textContent = fam.en;
  $("learnFamKo").textContent = fam.ko;
  $("learnFamShort").textContent = fam.ko;
  $("learnFamShort").style.color = fam.color;

  /* 카드 등장 리셋 */
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "fade .3s var(--ease) both";

  $("nextBtn").textContent = learnIndex===49 ? "50개 다 외웠어요! 문제 풀기 🎯" : "다음 원소 →";
}
$("nextBtn").addEventListener("click",function(){
  sfx.tap();
  if(learnIndex<49){ learnIndex++; renderLearn(); }
  else startQuiz();
});
$("startBtn").addEventListener("click", startLearning);
$("homeBtn1").addEventListener("click", function(){ show("home"); });
$("homeBtn2").addEventListener("click", function(){ show("home"); });
$("retryBtn").addEventListener("click", function(){ startLearning(); });

/* ── 퀴즈 ─────────────────────────────────────────── */
function startQuiz(){
  ac();
  quizList = shuffle(elements).slice(0,20);
  quizIndex = 0; score = 0; answered = false; combo = 0; bestCombo = 0;
  show("quiz");
  renderQuiz();
}

function renderQuiz(){
  const e = quizList[quizIndex];
  $("quizCount").innerHTML = "<b>"+(quizIndex+1)+"</b> / 20";
  $("quizBar").style.width = ((quizIndex+1)/20*100)+"%";
  $("score").textContent = score;
  $("question").innerHTML = "「<span>"+e[1]+"</span>」의 원소 기호는 무엇일까요?";
  $("answerInput").value="";
  $("feedback").textContent="";
  $("feedback").className="feedback";
  $("answerInput").disabled=false;
  $("submitBtn").disabled=false;
  answered=false;
  const cb=$("combo");
  if(combo>=2){ cb.textContent="🔥 "+combo+" COMBO"; cb.classList.add("on"); }
  else { cb.classList.remove("on"); }
  setTimeout(function(){ try{ $("answerInput").focus({preventScroll:true}); }catch(err){ $("answerInput").focus(); } },60);
}

function submitAnswer(){
  if(answered) return;
  const input = $("answerInput").value.trim();
  if(!input){ $("feedback").textContent="답을 입력해주세요!"; return; }
  ac();
  const correct = quizList[quizIndex][0];
  answered = true;
  $("answerInput").disabled = true;
  $("submitBtn").disabled = true;

  if(input.toLowerCase() === correct.toLowerCase()){
    score++; combo++;
    if(combo>bestCombo) bestCombo=combo;
    $("feedback").className="feedback ok";
    $("feedback").textContent = "⭕ 정답! " + quizList[quizIndex][1] + " = " + correct + (combo>=3?"  🔥 "+combo+"콤보":"");
    if(combo>=3 && combo%3===0) sfx.combo(); else sfx.ok();
    if(combo>=2){ const cb=$("combo"); cb.textContent="🔥 "+combo+" COMBO"; cb.classList.add("on"); }
  }else{
    combo = 0;
    $("feedback").className="feedback no";
    $("feedback").textContent = "❌ 아쉬워요! 정답은 " + correct + " (" + quizList[quizIndex][1] + ")";
    sfx.no();
    $("combo").classList.remove("on");
  }
  $("score").textContent = score;
  $("quizBar").style.width = ((quizIndex+1)/20*100)+"%";

  setTimeout(function(){
    quizIndex++;
    if(quizIndex>=quizList.length) finishQuiz();
    else renderQuiz();
  }, 880);
}
$("submitBtn").addEventListener("click", submitAnswer);
$("answerInput").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); submitAnswer(); } });

function finishQuiz(){
  show("result");
  sfx.finish();
  $("resultScore").textContent = score;
  const pct = Math.round(score/20*100);
  $("resultText").innerHTML = "20문제 중 <b>"+score+"개</b>를 맞혔어요! ("+pct+"%)<br>" +
    (score===20 ? "🏆 완벽해요! 원소 박사네요!" : score>=15 ? "🌟 정말 잘했어요!" : "💪 다시 도전하면 더 잘할 수 있어요!");
  $("resultStats").innerHTML =
    '<span class="pill">정답률 '+pct+'%</span>'+
    '<span class="pill v">최고 콤보 '+(bestCombo||0)+'</span>'+
    '<span class="pill p">'+ (score>=16?"등급 A":score>=12?"등급 B":"등급 C") +'</span>';
  $("reviewGrid").innerHTML = quizList.map(function(e){
    const fam = famOf(e[0]);
    return '<div class="mini" style="border-color:'+fam.color+'55"><span class="z">'+e[2]+'</span><b>'+e[0]+'</b><span>'+e[1]+'</span></div>';
  }).join("");
}
</script>
