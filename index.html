<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 CODEX 게임 관리소</title>
<style>
:root{--bg:#090d18;--panel:#12192b;--line:#2b3960;--text:#f3f6ff;--muted:#adb8d2;--accent:#687cff;--gold:#eac458;--danger:#b84b5c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0,#27305d 0,transparent 30%),radial-gradient(circle at 85% 0,#4a2b57 0,transparent 28%),linear-gradient(150deg,#060914,#0c1220 60%,#070a13)}
.app{width:min(1100px,100%);margin:auto;padding:14px}
header,.card{background:linear-gradient(145deg,rgba(18,25,43,.97),rgba(13,19,34,.97));border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 42px #0006}
header{padding:20px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:clamp(1.8rem,6vw,3rem)}h2{margin:0 0 8px}
.muted{color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#0d1426;border:1px solid var(--line);border-radius:15px;text-align:center;padding:10px}.stat b{display:block;color:var(--gold);font-size:1.25rem}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{padding:18px}.gameIcon{font-size:2.8rem}.badge{display:inline-block;background:#202b4d;padding:5px 9px;border-radius:999px;font-size:.75rem;margin:2px 4px 8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button,.playLink{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#263452;color:white;font-weight:800;font-size:.92rem;cursor:pointer;text-decoration:none;text-align:center;display:block}
button:hover,.playLink:hover{filter:brightness(1.12)}.primary{background:linear-gradient(135deg,#6074ee,#7a55d1)}.gold{background:#aa842c;color:#191305}.danger{background:#6b2632}.back{background:#2a344c}
.view{display:none}.view.active{display:block}.hero{background:#0d1528;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.count{font-size:1.1rem;margin:8px 0}.count strong{color:var(--gold)}.small{font-size:.77rem;color:var(--muted);line-height:1.55}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#192442;border:1px solid var(--gold);padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#toast.show{opacity:1}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="muted">🎮 MY GAME HUB</div>
  <h1>CODEX 게임 관리소</h1>
  <div class="muted">5개의 게임을 따로 관리하고 바로 실행할 수 있는 개인 게임 관리 앱</div>
  <div class="stats">
    <div class="stat">게임<b id="gameTotal">5</b></div>
    <div class="stat">전체 플레이<b id="playTotal">0</b></div>
    <div class="stat">관리 가능<b>5</b></div>
  </div>
</header>

<main id="listView" class="view active">
  <div class="games" id="gameList"></div>
</main>

<main id="manageView" class="view">
  <div class="card">
    <button class="back" style="width:auto" onclick="goList()">← 게임 목록</button>
    <div class="hero">
      <div class="gameIcon" id="mIcon">🎮</div>
      <h2 id="mName"></h2>
      <div class="badge">게임 관리</div>
      <div class="count">📊 플레이 횟수: <strong id="mCount">0</strong>회</div>
      <a id="mPlay" class="playLink primary" href="#" target="_blank" rel="noopener">▶️ 이 게임 플레이</a>
    </div>
    <div class="hero">
      <h3>📖 게임 설명</h3>
      <p id="mDesc" class="muted"></p>
      <h3>🎯 게임하는 방법</h3>
      <p id="mHow" class="muted"></p>
    </div>
    <div class="actions">
      <button class="gold" onclick="resetCurrent()">🔄 플레이 횟수 초기화</button>
      <button class="danger" onclick="confirmResetCurrent()">🗑️ 초기화 확인</button>
    </div>
    <p class="small">초기화는 이 관리 앱에서 기록한 해당 게임의 플레이 횟수만 0회로 만듭니다. 원래 게임의 세이브 데이터는 삭제하지 않습니다.</p>
  </div>
</main>

<main id="playView" class="view">
  <div class="card" style="padding:0;overflow:hidden">
    <button class="back" style="width:auto;margin:10px" onclick="goList()">← 게임 목록</button>
    <iframe id="playFrame" style="width:100%;height:80vh;border:0;display:block;background:#fff" sandbox="allow-scripts allow-forms allow-modals allow-same-origin allow-popups"></iframe>
  </div>
</main>
</div>
<div id="toast"></div>

function b64ToUtf8(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(bytes)}
let currentId=null;
const KEY="codexGameHub.play.";
function count(id){return Number(localStorage.getItem(KEY+id)||0)}
function setCount(id,n){localStorage.setItem(KEY+id,String(Math.max(0,n)))}
function total(){return GAMES.reduce((s,g)=>s+count(g.id),0)}
function icon(name){return name.split(" ")[0]||"🎮"}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1400)}
function url(g){return encodeURI("./"+g.file)}
function play(id){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  setCount(id,count(id)+1);render();toast("▶️ "+g.name+" 실행");
  if(g.embedded){
    document.getElementById("playFrame").srcdoc=b64ToUtf8(EMBEDDED[id]);
    document.getElementById("listView").classList.remove("active");
    document.getElementById("manageView").classList.remove("active");
    document.getElementById("playView").classList.add("active");
    window.scrollTo(0,0);
  }else{
    window.open(url(g),"_blank");
  }
}
function manage(id){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  currentId=id;
  document.getElementById("mIcon").textContent=icon(g.name);
  document.getElementById("mName").textContent=g.name;
  document.getElementById("mCount").textContent=count(id);
  document.getElementById("mDesc").textContent=g.desc;
  document.getElementById("mHow").textContent=g.how;
  const p=document.getElementById("mPlay");p.href=g.embedded?"#":url(g);p.onclick=e=>{e.preventDefault();play(id)};
  document.getElementById("listView").classList.remove("active");
  document.getElementById("manageView").classList.add("active");
  window.scrollTo(0,0);
}
function goList(){
  const wasPlaying=document.getElementById("playView").classList.contains("active");
  currentId=null;
  document.getElementById("manageView").classList.remove("active");
  document.getElementById("playView").classList.remove("active");
  document.getElementById("listView").classList.add("active");
  document.getElementById("playFrame").srcdoc="";
  render();window.scrollTo(0,0);
  if(wasPlaying)toast("🛑 게임을 종료했습니다");
}
function resetCurrent(){if(currentId===null)return;setCount(currentId,0);document.getElementById("mCount").textContent="0";render();toast("🔄 플레이 횟수를 0회로 초기화했습니다.")}
function confirmResetCurrent(){if(currentId===null)return;const g=GAMES.find(x=>x.id===currentId);if(confirm("「"+g.name+"」의 플레이 횟수를 0회로 초기화할까요?"))resetCurrent()}
function render(){
  const root=document.getElementById("gameList");root.innerHTML="";
  GAMES.forEach(g=>{
    const c=document.createElement("section");c.className="card";
    c.innerHTML='<div class="gameIcon">'+icon(g.name)+'</div><h2>'+g.name+'</h2><span class="badge">플레이 '+count(g.id)+'회</span><span class="badge">Chrome 실행</span><p class="muted">'+g.desc+'</p><div class="actions"><button class="primary" data-play="'+g.id+'">▶️ 게임 실행</button><button data-manage="'+g.id+'">⚙️ 관리하러 가기</button></div>';
    root.appendChild(c);
  });
  root.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play));
  root.querySelectorAll("[data-manage]").forEach(b=>b.onclick=()=>manage(b.dataset.manage));
  document.getElementById("gameTotal").textContent=GAMES.length;
  document.getElementById("playTotal").textContent=total();
}
render();
</script>
</body>
</html>
